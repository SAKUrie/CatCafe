<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猫咖营业计划 · HTML 复刻</title>
<!--
  猫咖营业计划的浏览器复刻件：开始界面 → 大厅 → 局内，外加房东奶奶的教程字条。
  只读项目现有资产，不写回任何游戏文件。

  · 画布锁死 1536×864 等比缩放，与 CatCafeDesignRootFitter 一致。
  · 美术层按相对路径直引 Assets/Resources/CatCafe/ 下的原图，不复制、不压缩。
  · 坐标、尺寸、字号、颜色、动画时长全部来自 cat_cafe_config.json 的 ui_* / meta_* / tutorial_* 配置。
  · 教程字条完全表驱动：弹什么、弹几次、聚光框谁，都由 Tutorials 表 + 已读位决定。

  没有移植的东西见文件末尾的 NOT_IMPLEMENTED 说明。

  数据来源：用 http 打开时优先 fetch 线上导出的 cat_cafe_config.json；
  file:// 双击打开时浏览器不允许 fetch 本地 JSON，回落到本文件内嵌快照。
  左下角角标会显示当前用的是哪一份。
-->
<style>
@font-face{
  font-family:'CatCafeUI';
  src:url('assets/Fonts/AlimamaFangYuanTiVF-Thin-2.ttf') format('truetype');
  font-display:block;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#120c0a;overflow:hidden}
body{font-family:'CatCafeUI','PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
#viewport{position:relative;width:100vw;height:100vh;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1536px;height:864px;
  transform-origin:50% 50%;background:#2b211c;user-select:none}
.screen{position:absolute;left:0;top:0;width:1536px;height:864px;display:none}
.screen.on{display:block}
.full{position:absolute;left:0;top:0;width:1536px;height:864px;pointer-events:none}
.abs{position:absolute}
.txt{display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1.2;white-space:pre-wrap}

/* ── 开始界面 ── */
/* start-glow 在 Unity 里走 CatCafeStartGlowBreathing：breath = 1 + sin(t·1.09)·0.32，
   rgb 和 alpha 一起乘。周期 2π/1.09 ≈ 5.76s。 */
#glowLayer{animation:glowBreath 5.764s linear infinite}
@keyframes glowBreath{
  0%  {filter:brightness(1);    opacity:1}
  12.5%{filter:brightness(1.226);opacity:1}
  25% {filter:brightness(1.32); opacity:1}
  37.5%{filter:brightness(1.226);opacity:1}
  50% {filter:brightness(1);    opacity:1}
  62.5%{filter:brightness(.774);opacity:.774}
  75% {filter:brightness(.68);  opacity:.68}
  87.5%{filter:brightness(.774);opacity:.774}
  100%{filter:brightness(1);    opacity:1}
}
.hotspot{position:absolute;cursor:pointer;background:transparent}
.hotspot.disabled{cursor:default}
/* 按钮反馈：把整层美术裁进按钮窗口，按下时只有这一块动，不会拖着整屏 */
.artbtn{position:absolute;overflow:hidden;pointer-events:none;transition:filter .1s,transform .1s}
.artbtn img{position:absolute}
.artbtn.hover{filter:brightness(1.07)}
.artbtn.press{transform:scale(.965)}

/* ── 大厅 ── */
.homeLayer{position:absolute;pointer-events:none}
.spriteCat{position:absolute;background-repeat:no-repeat;pointer-events:none}
#dexFill{position:absolute;border-radius:8px;transition:width .3s ease}

/* ── 棋盘 ── */
#board{position:absolute}
.cell{position:absolute;display:flex;align-items:center;justify-content:center}
.token{position:relative;width:104px;height:104px;cursor:pointer;transition:transform .12s ease}
.token img{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
  filter:drop-shadow(-3px 2px 0 rgba(46,26,14,.30))}
.token:hover{transform:scale(1.05)}
.token.pulse{animation:tokenPulse var(--pulse,.32s) ease-out}
@keyframes tokenPulse{0%{transform:scale(1)}45%{transform:scale(var(--peak,1.08))}100%{transform:scale(1)}}
.cell .marker{position:absolute;left:0;top:0;width:126px;height:126px;border-radius:12px;
  background:#ffd27a;opacity:0;pointer-events:none;transition:opacity .16s ease;mix-blend-mode:screen}
.cell.linked .marker{opacity:var(--markerAlpha,.24)}
/* 结算辉光：Unity 用棋子的 alpha 遮罩 + 专用 Shader 做软发光，CSS 的 drop-shadow
   同样贴合 alpha 轮廓，叠三层就是由内到外的光晕。呼吸参数照 CatCafeGlowPulse：
   周期 0.9s、强度在 0.82~1 之间摆动。强调色取 Unity 的 (1, 0.82, 0.35) = #FFD159。 */
@keyframes pieceGlowBreath{
  0%,100%{filter:drop-shadow(-3px 2px 0 rgba(46,26,14,.30))
                 drop-shadow(0 0 6px rgba(255,209,89,.78))
                 drop-shadow(0 0 16px rgba(255,209,89,.60))
                 drop-shadow(0 0 30px rgba(255,176,54,.42))}
  50%    {filter:drop-shadow(-3px 2px 0 rgba(46,26,14,.30))
                 drop-shadow(0 0 8px rgba(255,209,89,.95))
                 drop-shadow(0 0 20px rgba(255,209,89,.78))
                 drop-shadow(0 0 38px rgba(255,176,54,.56))}
}
.cell.linked .token img{animation:pieceGlowBreath .9s ease-in-out infinite}
#chainLines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* ── 卷轴 ── */
#reels{position:absolute;left:0;top:0;display:none}
.reel{position:absolute;overflow:hidden}
.reel .strip{position:absolute;left:0;top:0}
.reel .sym{position:absolute;left:0;display:flex;align-items:center;justify-content:center}
.reel .sym img{max-width:106px;max-height:106px;object-fit:contain;
  filter:drop-shadow(-3px 2px 0 rgba(46,26,14,.30))}
.reel .shade{position:absolute;left:0;width:100%;height:84px;pointer-events:none}
.reel .shade.top{top:0;background:linear-gradient(180deg,rgba(15,10,8,.48),rgba(15,10,8,0))}
.reel .shade.bottom{bottom:0;background:linear-gradient(0deg,rgba(15,10,8,.48),rgba(15,10,8,0))}
.reel .blur{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,224,168,0),rgba(255,224,168,.55),rgba(255,224,168,0))}

/* ── 左页 / 右页 ── */
#buffList{position:absolute;transform-origin:50% 50%}
.sticker{position:absolute;cursor:pointer}
.sticker img{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
  filter:drop-shadow(-2px 1.5px 0 rgba(46,26,14,.24))}
.sticker:hover{filter:brightness(1.06)}
.tape{position:absolute;background:rgba(232,208,167,.72);box-shadow:1px -1px 0 rgba(104,72,44,.16)}
.raritytab{position:absolute;border-radius:2px}
#roster{position:absolute;overflow:hidden}
.rosterEntry{position:absolute;cursor:pointer}
.rosterEntry img{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
  filter:drop-shadow(-2px 1.5px 0 rgba(46,26,14,.24))}
.rosterEntry:hover{filter:brightness(1.06)}
.rosterEntry .cnt{position:absolute;right:2px;bottom:1px;width:46px;height:24px;
  display:flex;align-items:center;justify-content:flex-end;color:#4d3021;font-weight:700;
  text-shadow:2px -2px 0 rgba(255,242,214,.95),-1px 1px 0 rgba(255,242,214,.95)}
.pagebtn{position:absolute;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;cursor:pointer;border:0;font-family:inherit}
.pagebtn:disabled{opacity:.32;cursor:default}

/* ── 飘字 / 特效 ── */
#fx{position:absolute;left:0;top:0;width:1536px;height:864px;pointer-events:none;overflow:hidden;z-index:30}
.rewardLabel{position:absolute;display:flex;align-items:center;font-weight:700;opacity:0}
.rewardLabel .glow{position:absolute;left:0;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(255,214,110,.8),rgba(255,214,110,0) 70%)}
.rewardLabel img{position:absolute;width:28px;height:28px;top:50%;transform:translateY(-50%)}
.rewardLabel span{position:absolute;text-align:left}
.burstCoin,.furFleck{position:absolute;pointer-events:none}

/* ── 弹窗 ── */
/* 容器铺满整块画布只为给弹层定位，本身必须放行点击，
   否则空着的时候会把三个界面上所有热区的点击全吃掉。 */
#overlays{position:absolute;left:0;top:0;width:1536px;height:864px;z-index:40;pointer-events:none}
.overlay{position:absolute;left:0;top:0;width:1536px;height:864px;pointer-events:auto;
  background:rgba(26,17,10,.78);display:flex;align-items:center;justify-content:center}
.modal{position:relative}
.modal .paper{position:absolute;left:50%;top:50%;
  border-image-slice:64 72 64 72 fill;border-image-repeat:stretch;
  border-style:solid;border-width:64px 72px}
.modal .inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px}
/* Unity spriteBorder 是 {x=左, y=下, z=右, w=上}，CSS slice 是「上 右 下 左」，顺序要换。
   而且 CSS 的 border-image 会吃掉内容盒，Unity 的 Sliced Image 不会——所以贴图单独一层。 */
.skin{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  border-image-repeat:stretch;border-style:solid}
.skin.modal9{border-image-slice:64 72 64 72 fill;border-width:64px 72px}
.skin.ribbon9{border-image-slice:32 170 32 170 fill;border-width:32px 170px}
.skin.button9{border-image-slice:34 64 34 64 fill;border-width:34px 64px}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;
  color:#ffeac2;font-weight:700;text-shadow:0 2px 0 rgba(60,32,18,.55)}
.paperbtn{position:relative;display:flex;align-items:center;justify-content:center;
  font-weight:700;cursor:pointer;white-space:nowrap;color:#fff5e2;text-shadow:0 2px 0 rgba(70,38,20,.6)}
.paperbtn.secondary{color:#4a2f1f;text-shadow:0 1px 0 rgba(255,246,226,.6)}
.paperbtn:hover{filter:brightness(1.07)}
.paperbtn:active{transform:translateY(2px)}
.paperbtn.off{opacity:.45;cursor:default;filter:none}

.cardrail{display:flex;align-items:center;justify-content:center}
.card{position:relative;cursor:pointer;flex:none;background-size:100% 100%;
  transition:transform .14s ease,filter .14s ease}
.card:hover{transform:translateY(-6px);filter:brightness(1.05)}
/* 卡片入场，参数照 PlayCardEntrance：错开 0.06s、单张 0.18s、从 alpha0 + 0.88 倍放大到位 */
@keyframes cardEnter{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.card.entering{animation:cardEnter .18s cubic-bezier(.22,.61,.36,1) both}
/* 揭晓页光环呼吸：Unity 是 sin(t·2.8)，周期 2π/2.8 ≈ 2.244s，内外圈反相 */
@keyframes haloOuterBreath{0%,100%{transform:scale(1.02)}50%{transform:scale(1.10)}}
@keyframes haloInnerBreath{0%,100%{transform:scale(1.04)}50%{transform:scale(0.98)}}
/* 联动受影响的棋子会挨一下：CatCafeLinkedPieceShake 的水平 7px / 垂直 2.2px /
   旋转 4 度 / 4.25 次振荡 / 阻尼衰减，这里用同样的参数打成关键帧。 */
@keyframes linkedShake{
  0%  {transform:translate(0,0) rotate(0deg)}
  12% {transform:translate(7px,-2.2px) rotate(4deg)}
  27% {transform:translate(-5.4px,1.7px) rotate(-3.1deg)}
  44% {transform:translate(3.9px,-1.2px) rotate(2.2deg)}
  62% {transform:translate(-2.4px,.8px) rotate(-1.4deg)}
  80% {transform:translate(1.1px,-.3px) rotate(.6deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}
.token.shaking{animation:linkedShake .3s ease-out}
.card .slot{position:absolute;display:flex;align-items:center;justify-content:center}
.card .art img{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
  filter:drop-shadow(-2px 1.5px 0 rgba(46,26,14,.24));z-index:2}
/* 稀有度底色：只换道具背后那块面板，卡片其余部分保持原本的纸色。
   颜色取 Rarities 表的 color，内阴影留住原图框的凹陷感，不做整卡混色。 */
.rarityWash{position:absolute;left:4.5%;top:3.5%;right:4.5%;bottom:3.5%;border-radius:4px;
  box-shadow:inset 0 0 12px rgba(40,22,10,.16), inset 0 2px 0 rgba(255,255,255,.16);
  pointer-events:none;z-index:1}
.card .badge{display:flex;align-items:center;justify-content:center;color:#fff2da;font-weight:700;
  background-size:100% 100%;background-repeat:no-repeat;text-shadow:0 1px 0 rgba(60,32,18,.5)}
.card .nm{color:#472c1c;font-weight:700}
.card .rule{color:#57422f;text-align:center;line-height:1.5;padding:0 4px;
  align-items:flex-start!important;overflow:hidden}
/* 规则文案里的内联棋子图标：图集烘的是 64px 方格，这里用源图裁到可见轮廓等价还原 */
.ico{display:inline-block;position:relative;overflow:hidden;vertical-align:-0.30em;margin:0 .06em}
.ico img{position:absolute;image-rendering:auto}
.symLink{color:#7A241A;cursor:pointer}
.symLink .symName{text-decoration:underline}
.symLink:hover{filter:brightness(1.25)}
/* 规则文案缩到最小字号还装不下时，允许滚轮翻看。Unity 那边是溢出到框外，
   两种都不好读，这里给个能滚的框 + 底部渐隐提示还有内容。 */
.scrollText{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(122,64,36,.45) transparent}
.scrollText::-webkit-scrollbar{width:5px}
.scrollText::-webkit-scrollbar-thumb{background:rgba(122,64,36,.45);border-radius:3px}
.scrollText::-webkit-scrollbar-track{background:transparent}
.hasMore{position:relative}
.hasMore::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(240,220,186,0),rgba(240,220,186,.92))}
.card .hasMore::after{background:linear-gradient(180deg,rgba(226,201,163,0),rgba(226,201,163,.95))}

/* 图鉴 */
.dexScroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.dexGrid{display:grid}
.dexCard{position:relative;background:rgba(255,246,225,.62);border:2px solid rgba(140,102,68,.45);
  border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:10px 8px;
  box-shadow:2px -2px 0 rgba(96,64,40,.12)}
.dexCard.locked{background:rgba(96,78,62,.42);border-color:rgba(90,70,52,.5)}
.dexCard .art{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
.dexCard .art img{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.dexCard.locked .art img{filter:brightness(.12) saturate(0);opacity:.9}
.dexCard .nm{color:#472c1c;font-weight:700}
.dexCard.locked .nm{color:#e2d5bf}
.dexCard .meta{color:#6b5137}
.dexCard.locked .meta{color:#bfae95}
.dexCard .flavor,.dexCard .hint{color:#5b432e;text-align:center;line-height:1.5;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:center;white-space:pre-wrap}
.dexCard.locked .flavor,.dexCard.locked .hint{color:#d8c9b1}

/* 招募 */
.inviteRow{display:flex;align-items:center;gap:14px;width:100%;padding:8px 14px;
  background:rgba(255,246,225,.55);border:2px solid rgba(140,102,68,.35);border-radius:10px}
.inviteRow.off{opacity:.55}
.inviteRow .pic{position:relative;flex:none;width:70px;height:70px}
.inviteRow .pic img{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.inviteRow .info{flex:1;display:flex;flex-direction:column;gap:2px;color:#4d3021}

/* ── 房东奶奶的字条 ── */
#noteRoot{position:absolute;left:0;top:0;width:1536px;height:864px;z-index:60;display:none}
#noteRoot .dim{position:absolute;background:rgba(14,9,6,.78)}
#noteRoot .edge{position:absolute;background:#ffd15c}
#notePaper{position:absolute;border-image-slice:64 72 64 72 fill;border-image-repeat:stretch;
  border-style:solid;border-width:64px 72px}
#noteBox{position:absolute}
#noteBox img.portrait{position:absolute;object-fit:contain}
#noteBox .noteTitle,#noteBox .noteBody,#noteBox .noteHint{position:absolute;white-space:pre-wrap}
#noteBox .noteTitle{display:flex;align-items:center;font-weight:700;color:#52301e}
#noteBox .noteBody{display:flex;align-items:center;color:#40291c;line-height:1.35}
#noteBox .noteHint{display:flex;align-items:center;justify-content:flex-end;color:#78593f}

#srcBadge{position:absolute;left:10px;bottom:6px;font-size:11px;color:rgba(255,238,206,.40);
  z-index:70;pointer-events:none;letter-spacing:.5px}
#loading{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;color:#e8d5b0;font-size:20px;z-index:90;background:#2b211c}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="screen" id="screenStart"></div>
    <div class="screen" id="screenHome"></div>
    <div class="screen" id="screenGame"></div>
    <div id="fx"></div>
    <div id="overlays"></div>
    <div id="noteRoot"></div>
    <div id="srcBadge"></div>
    <div id="loading">正在翻开账本…</div>
  </div>

in_04_reward","trigger_key":"run_first_reward","copy":"每个波次结束后，可以挑一张加入店内名册；没有合适的，也可以先不收。名册越长，单张上场的机会越少。","spotlight_target":"run_reward_cards","once":true,"enabled":true,"appear_note":"第 1 波次结束、第一次挑选名册内容时"},{"id":"main_06_rent","trigger_key":"run_first_rent_countdown","copy":"下一次就是今天最后一个波次。先看看还差多少营业额，再决定是否调整名册。","spotlight_target":"run_rent_progress","once":true,"enabled":true,"appear_note":"第一次来到当天最后一个波次前"},{"id":"main_07_summary","trigger_key":"run_first_summary","copy":"今天的营业结束了。新认识的猫已经记进收集册，下次营业时可能再次遇见；初始名册不会因此改变。","spotlight_target":"run_collection_summary","once":true,"enabled":true,"appear_note":"第一次完成整次营业、查看营业总结时"},{"id":"main_08_new_cat","trigger_key":"home_first_new_cat","copy":"新朋友已经住下了，我把名字记进收集册了。想看它的资料，就去左边的收集册。","spotlight_target":"home_new_cat","once":true,"enabled":true,"appear_note":"第一次带着新认识的猫回到大厅时"},{"id":"main_09_second_run","trigger_key":"run_second_before_roll","copy":"新一次营业会从初始名册开始。途中加入名册的内容和营业道具，只在这次营业中生效。","spotlight_target":"run_spin_button","once":true,"enabled":true,"appear_note":"第二次开始营业、第 1 波次前"},{"id":"context_nursery","trigger_key":"nursery_first_seen","copy":"这是育儿窝。把它放在两只成年猫旁边，可能会迎来一只小猫。","spotlight_target":"run_nursery","once":true,"enabled":true,"appear_note":"棋盘上第一次出现育儿窝时"},{"id":"context_birth","trigger_key":"breeding_first_birth","copy":"小猫出生了。它暂时不能工作，但客人见到会很高兴。","spotlight_target":"run_newborn","once":true,"enabled":true,"appear_note":"第一次有小猫出生后"},{"id":"context_item","trigger_key":"item_choice_first","copy":"每天结束后，可以为这次营业挑一件营业道具。它会持续生效，选一件适合当前名册的。","spotlight_target":"run_reward_cards","once":true,"enabled":true,"appear_note":"第一次完成一天营业、挑选营业道具时"},{"id":"context_failure","trigger_key":"run_first_failure","copy":"今天没有完成目标营业额，这次营业到这里结束。下次会从初始名册重新开始，新认识的猫仍会留在收集册里。","spotlight_target":"","once":true,"enabled":true,"appear_note":"第一次没有完成当天目标营业额时"},{"id":"context_reroll","trigger_key":"reroll_ticket_first","copy":"这一批没有合适的，就使用一张招呼券换一批。也可以不收，按自己的计划来。","spotlight_target":"run_reroll_button","once":true,"enabled":true,"appear_note":"第一次 <script>
"use strict";
/* ==========================================================================
   0. 数据装载
   ========================================================================== */
const RES_BASE = 'assets/';
const ART = RES_BASE + 'CatCafe/';
const CONFIG_URL = ''; // 分发副本：身边没有导出表，用内嵌快照
/**
 * 开发说明开关。界面上那些「这是复刻件 / 某某功能走 Unity 端 / 道具不生效」的话
 * 是给我们自己看的，玩家不该看到。默认关；要自查移植边界时改成 true。
 */
const DEV_NOTES = false;

const RULE_FIELDS = ['rule_id','owner_key','trigger','priority','operation','primary_scope',
  'primary_filter','primary_comparator','primary_threshold','base_value','primary_factor',
  'divisor','reason'];

let D = JSON.parse(document.getElementById('snapshot').textContent);
let dataSource = '内嵌快照';

/** 线上导出的整表和内嵌快照结构不同，压成同一个形状。 */
function adoptLiveConfig(raw){
  const on = rows => (rows || []).filter(r => r.enabled !== false);
  const ui = {};
  for (const s of on(raw.settings)) ui[s.key] = s.value;
  return {
    ui, rarities:on(raw.rarities), elements:on(raw.elements), items:on(raw.items),
    stages:on(raw.stages), weights:on(raw.weights), initialDeck:on(raw.initialDeck),
    tutorials:on(raw.tutorials), invites:on(raw.invites), intimacy:on(raw.intimacy),
    rules: on(raw.rules)
      .filter(r => r.owner_type === 'element' && r.operation === 'income' && r.trigger === 'round')
      .map(r => { const o = {}; for (const f of RULE_FIELDS) o[f] = r[f]; return o; }),
    bbox: D.bbox, // 包围盒来自离线扫图，线上表里没有
  };
}

/* ==========================================================================
   1. 配置读取（对应 UiValue / UiColor / UiString）
   ========================================================================== */
const U = {
  raw(key){ return D.ui[key]; },
  num(key){ const v = parseFloat(D.ui[key]); if (isNaN(v)) throw new Error('缺少配置 ' + key); return v; },
  int(key){ return Math.round(U.num(key)); },
  numOr(key, fallback){ const v = parseFloat(D.ui[key]); return isNaN(v) ? fallback : v; },
  str(key){ const v = D.ui[key]; if (v == null) throw new Error('缺少配置 ' + key); return v; },
  strOr(key, fallback){ return D.ui[key] != null ? D.ui[key] : fallback; },
  color(key){ return D.ui[key] || '#000'; },
  /** TMP / Text 字号统一乘 ui_font_size_scale（CatCafeUiFontProvider.ScaleSize） */
  font(size){ return (size * U.num('ui_font_size_scale')).toFixed(1) + 'px'; },
  rect(prefix){
    return { x:U.num(prefix+'_x'), y:U.num(prefix+'_y'),
             w:U.num(prefix+'_width'), h:U.num(prefix+'_height') };
  },
  /** 换行已在 normalizeConfigText 里统一处理过，这里留着只为读代码时一眼看出"这条会换行" */
  multiline(key){ return U.str(key); },
};

const BOARD = {};
function initBoardMetrics(){
  BOARD.cols = parseInt(D.ui.board_columns || 4, 10);
  BOARD.rows = parseInt(D.ui.board_rows || 4, 10);
  BOARD.size = BOARD.cols * BOARD.rows;
  BOARD.cell = U.num('ui_board_cell_size');
  BOARD.gapX = U.num('ui_board_spacing_x');
  BOARD.gapY = U.num('ui_board_spacing_y');
  BOARD.pad  = U.num('ui_board_padding');
  BOARD.icon = U.num('ui_board_icon_size');
  BOARD.pitchX = BOARD.cell + BOARD.gapX;
  BOARD.pitchY = BOARD.cell + BOARD.gapY;
  BOARD.w = BOARD.cols * BOARD.cell + (BOARD.cols - 1) * BOARD.gapX + BOARD.pad * 2;
  BOARD.h = BOARD.rows * BOARD.cell + (BOARD.rows - 1) * BOARD.gapY + BOARD.pad * 2;
  BOARD.x = U.num('ui_board_x');
  BOARD.y = U.num('ui_board_y');
}

/* ==========================================================================
   2. DOM 小工具
   ========================================================================== */
const $ = sel => document.querySelector(sel);
function el(tag, cls, parent){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.appendChild(n);
  return n;
}
/** 按左上角坐标摆放，等同 PlaceTopLeft */
function place(node, x, y, w, h){
  node.style.left = x + 'px'; node.style.top = y + 'px';
  if (w != null) node.style.width = w + 'px';
  if (h != null) node.style.height = h + 'px';
  return node;
}
function placeRect(node, r){ return place(node, r.x, r.y, r.w, r.h); }
function text(node, value){ node.textContent = value; return node; }
function fmt(template, ...args){
  return String(template).replace(/\{(\d+)\}/g, (m, i) => args[i] != null ? args[i] : m);
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

function makeText(parent, size, color, cls){
  const n = el('div', 'abs txt ' + (cls || ''), parent);
  n.style.fontSize = U.font(size);
  n.style.color = color;
  return n;
}
/**
 * 复刻 TMP 的 enableAutoSizing：fontSizeMax = 缩放后字号，fontSizeMin = max(9, 它减 6)。
 * 差别只有一处：TMP 的 overflowMode 是 Overflow，缩到底还装不下会溢出到框外；
 * 这里是裁掉。卡面规则那种长文案在 Unity 上会多露一行尾巴。
 */
function autoShrink(node, size){
  const max = size * U.num('ui_font_size_scale');
  const min = Math.max(9, max - 6);
  for (let px = max; px >= min; px -= 0.5){
    node.style.fontSize = px.toFixed(1) + 'px';
    if (node.scrollHeight <= node.clientHeight + 1){ markScrollable(node); return; }
  }
  markScrollable(node);
}

/**
 * 缩到最小字号仍装不下就让它能滚。TMP 的做法是溢出到框外，网页这边溢出会压到别的
 * 元素上，改成可滚 + 底部渐隐，至少读得全。滚轮事件要吃掉，别把整页带着滚。
 */
function markScrollable(node){
  const more = node.scrollHeight > node.clientHeight + 1;
  node.classList.toggle('scrollText', more);
  node.classList.toggle('hasMore', more);
  if (!more || node.dataset.scrollBound) return;
  node.dataset.scrollBound = '1';
  node.addEventListener('wheel', e => {
    e.stopPropagation();
    node.scrollTop += e.deltaY;
    // 滚到底就把渐隐收掉，免得看着像还有内容
    node.classList.toggle('hasMore', node.scrollTop + node.clientHeight < node.scrollHeight - 1);
  }, { passive:true });
  // 卡片本身可点选，滚动时别误触
  node.addEventListener('pointerdown', e => e.stopPropagation());
}
/** 把任意节点的位置换算回 1536×864 设计坐标，聚光框要用 */
function designRect(node){
  const s = $('#stage').getBoundingClientRect();
  const b = node.getBoundingClientRect();
  const scale = s.width / 1536;
  return { x:(b.left - s.left) / scale, y:(b.top - s.top) / scale,
           w:b.width / scale, h:b.height / scale };
}

/* ==========================================================================
   3. 棋子视觉归一化（移植 NormalizePawnVisual）
      Unity 按 Sprite 的可见轮廓统一棋子尺寸，并把透明留白造成的偏心校正回来。
      这里用离线扫出的 alpha 包围盒做同样的事，源图不裁不缩。
   ========================================================================== */
function pawnVisual(imgNode, asset, containerW, containerH, targetVisible){
  const b = D.bbox[asset];
  imgNode.src = ART + encodeURI(asset) + '.png';
  if (!b){
    imgNode.style.cssText += `width:${containerW}px;height:${containerH}px;object-fit:contain;` +
      `transform:translate(-50%,-50%);`;
    return 1;
  }
  const [bx, by, bw, bh, W, H] = b;
  const fit = Math.min(containerW / W, containerH / H);
  const visibleExtent = Math.max(bw, bh) * fit;
  const scale = visibleExtent <= 0.001 ? 1 : clamp(
    targetVisible / visibleExtent, U.num('ui_pawn_visual_scale_min'), U.num('ui_pawn_visual_scale_max'));
  const dx = (bx + bw / 2 - W / 2) * fit * scale;
  const dy = (by + bh / 2 - H / 2) * fit * scale;
  imgNode.style.width = (W * fit) + 'px';
  imgNode.style.height = (H * fit) + 'px';
  imgNode.style.transform =
    `translate(calc(-50% + ${-dx}px), calc(-50% + ${-dy}px)) scale(${scale})`;
  return scale;
}

/* ==========================================================================
   4. 局外存档（对应 CatCafeMeta / CatCafeUserSettings，落 localStorage）
   ========================================================================== */
const SAVE_KEY = 'catcafe-html-meta-v1';
const META = {
  discovered: {},      // element key -> true，收集册
  tutorialsRead: {},   // tutorial id -> true
  tutorialEnabled: true,
  fur: {},             // element key -> 撮
  cans: 0,
  jarStamp: 0,         // 上次收取罐头的时间戳
  furStamp: 0,         // 上次结算自然积攒绒毛的时间戳
  runs: 0, clears: 0,
  playerName: '',      // 试玩登记的名字
  bestScore: 0,        // 最高累计营业额
  submitted: false,    // 是否已提交过
};
function loadMeta(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) Object.assign(META, JSON.parse(raw));
  } catch (e){ /* 存档坏了就当新档，不打断 */ }
  const now = Date.now();
  if (!META.jarStamp) META.jarStamp = now;
  if (!META.furStamp) META.furStamp = now;
  // 初始名册里的猫开局就算认识，否则第一次进招募会一条都点不动
  for (const row of D.initialDeck){
    const def = D.elements.find(e => e.key === row.element_key);
    if (def && (def.kind === 'cat' || def.kind === 'kitten')) META.discovered[def.key] = true;
  }
}
function saveMeta(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e){ /* 无痕模式就不存 */ }
}
function discover(key){
  if (META.discovered[key]) return false;
  META.discovered[key] = true;
  META.cans += U.numOr('meta_cans_per_first_discovery', 20);
  saveMeta();
  return true;
}
const catElements = () => D.elements.filter(e => e.kind === 'cat' || e.kind === 'kitten');
const discoveredCats = () => catElements().filter(e => META.discovered[e.key]);

/** 罐头罐：按现实时间和住店猫数积攒，上限 meta_jar_cap */
function pendingJar(){
  const rate = U.numOr('meta_jar_rate_per_minute_per_cat', 0.2);
  const cap = U.numOr('meta_jar_cap', 50);
  const minutes = (Date.now() - META.jarStamp) / 60000;
  return Math.min(cap, Math.floor(minutes * rate * Math.max(1, discoveredCats().length)));
}
/** 绒毛：每 meta_fur_natural_interval_minutes 分钟 +N，每个品种封顶 */
function settleNaturalFur(){
  const interval = U.numOr('meta_fur_natural_interval_minutes', 60);
  const amount = U.numOr('meta_fur_natural_amount_per_interval', 1);
  const cap = U.numOr('meta_fur_natural_cap_per_breed', 12);
  const ticks = Math.floor((Date.now() - META.furStamp) / (interval * 60000));
  if (ticks <= 0) return 0;
  META.furStamp += ticks * interval * 60000;
  let gained = 0;
  for (const cat of discoveredCats()){
    const before = META.fur[cat.key] || 0;
    if (before >= cap) continue;
    const after = Math.min(cap, before + ticks * amount);
    gained += after - before;
    META.fur[cat.key] = after;
  }
  if (gained) saveMeta();
  return gained;
}

/* ==========================================================================
   5. 局内状态
   ========================================================================== */
const S = {
  money:0, round:0, stageIndex:0, stageRound:0,
  pool:[], board:[], items:[], rerollTokens:0, removalTokens:0,
  buffPage:0, rosterPage:0, busy:false,
  lastIncome:{}, runFur:0, runDiscoveries:[],
  endless:false, totalRevenue:0,
};
const defs = {}, itemDefs = {}, rarityDefs = {}, tutorialByTrigger = {};
const rulesByOwner = {};
let uidSeed = 0;
const BUFFS_PER_PAGE = 8;   // 左页 2 列 × 4 行
const PIECES_PER_PAGE = 10; // 右页 2 列 × 5 行
const REF = {};

/**
 * 表格里的换行是「反斜杠 + n」两个字符（Excel 存不了真换行），Unity 那边由 TMP 解释，
 * 网页这边不处理就会把 \n 原样印在界面上。这里在装载时一次性规整，
 * 避免每个取值点各自记得转一次——漏一个就是界面上多一个 \n。
 */
function normalizeConfigText(){
  const fix = v => typeof v === 'string' ? v.split('\\n').join('\n') : v;
  for (const key in D.ui) D.ui[key] = fix(D.ui[key]);
  const TEXT_FIELDS = {
    elements: ['name','type_label','rule_text','dex_hint','dex_flavor'],
    items: ['name','rule_text'],
    tutorials: ['copy'],
    invites: ['notes'],
    stages: ['name'],
    rarities: ['label'],
  };
  for (const table in TEXT_FIELDS)
    for (const row of D[table] || [])
      for (const field of TEXT_FIELDS[table]) row[field] = fix(row[field]);
}

function indexData(){
  normalizeConfigText();
  NORMAL_STAGE_COUNT = D.stages.length;
  rebuildSymbolCandidates();
  for (const e of D.elements) defs[e.key] = e;
  for (const i of D.items) itemDefs[i.key] = i;
  for (const r of D.rarities) rarityDefs[r.key] = r;
  for (const t of D.tutorials) tutorialByTrigger[t.trigger_key] = t;
  for (const r of D.rules) (rulesByOwner[r.owner_key] = rulesByOwner[r.owner_key] || []).push(r);
  for (const k in rulesByOwner) rulesByOwner[k].sort((a, b) => (a.priority || 0) - (b.priority || 0));
}
let NORMAL_STAGE_COUNT = 0;   // 正常经营的天数，进无尽后 D.stages 会被追加，得先记住
const SCORE_LINE_FORMAT = '本次累计营业额：{0} 金币';
const stage = () => D.stages[Math.min(S.stageIndex, D.stages.length - 1)];
const isCat = e => e && (e.kind === 'cat' || e.kind === 'kitten');
function newPiece(key){ return { key, uid: ++uidSeed, lifetimeRounds: 0 }; }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ==========================================================================
   6. 收益结算（移植 Rules 表 element/income/round 那 236 条）
   ========================================================================== */
function containsToken(filter, key){
  if (!filter) return false;
  return String(filter).split('|').some(t => t.trim() === key);
}
function orthogonal(index){
  const r = Math.floor(index / BOARD.cols), c = index % BOARD.cols, out = [];
  if (r > 0) out.push(index - BOARD.cols);
  if (r < BOARD.rows - 1) out.push(index + BOARD.cols);
  if (c > 0) out.push(index - 1);
  if (c < BOARD.cols - 1) out.push(index + 1);
  return out;
}
const nearbyPieces = index => orthogonal(index).map(i => S.board[i]).filter(Boolean);

function evalScope(scope, filter, piece, index, nearby){
  const defOf = p => defs[p.key];
  switch (scope){
    case '': case 'none': return 0;
    case 'adjacent_cats':  return nearby.filter(p => isCat(defOf(p))).length;
    case 'adjacent_kind':  return nearby.filter(p => defOf(p).kind === String(filter || '').toLowerCase()).length;
    case 'adjacent_key':   return nearby.filter(p => containsToken(filter, p.key)).length;
    case 'adjacent_empty': return orthogonal(index).filter(i => !S.board[i]).length;
    case 'board_cats':     return S.board.filter(p => p && isCat(defOf(p))).length;
    case 'board_kind':     return S.board.filter(p => p && defOf(p).kind === String(filter || '').toLowerCase()).length;
    case 'board_key':      return S.board.filter(p => p && containsToken(filter, p.key)).length;
    case 'board_empty':    return S.board.filter(p => !p).length;
    case 'round_number':   return S.round + 1;
    case 'instance_rounds':       return piece.lifetimeRounds;
    case 'instance_round_number': return piece.lifetimeRounds + 1;
    case 'self_rarity':    return D.rarities.findIndex(r => r.key === defOf(piece).rarity);
    case 'self_corner': {
      const r = Math.floor(index / BOARD.cols), c = index % BOARD.cols;
      return (r === 0 || r === BOARD.rows - 1) && (c === 0 || c === BOARD.cols - 1) ? 1 : 0;
    }
    case 'same_row_key': {
      const r = Math.floor(index / BOARD.cols); let n = 0;
      for (let c = 0; c < BOARD.cols; c++){
        const p = S.board[r * BOARD.cols + c];
        if (p && p !== piece && containsToken(filter, p.key)) n++;
      }
      return n;
    }
    case 'board_key_or_adjacent_key': {
      const keys = String(filter || '').split(';');
      const boardCount = keys[0] ? S.board.filter(p => p && containsToken(keys[0], p.key)).length : 0;
      const hasAdjacent = keys.length > 1 && nearby.some(p => containsToken(keys[1], p.key));
      return hasAdjacent ? BOARD.size : boardCount;
    }
    default: return 0; // 未移植的作用域一律按 0，不硬编造数值
  }
}
function passes(cmp, value, threshold){
  switch (cmp || 'always'){
    case 'always': return true;
    case 'eq': return value === threshold;
    case 'ne': return value !== threshold;
    case 'ge': return value >= threshold;
    case 'gt': return value > threshold;
    case 'le': return value <= threshold;
    case 'lt': return value < threshold;
    case 'modulo_zero': return threshold > 0 && value % threshold === 0;
    default: return false;
  }
}
function evaluatePiece(piece, index, trigger){
  const nearby = nearbyPieces(index);
  let amount = 0, linked = false, sources = [];
  for (const rule of rulesByOwner[piece.key] || []){
    if (rule.trigger !== (trigger || 'round')) continue;
    const primary = evalScope(rule.primary_scope, rule.primary_filter, piece, index, nearby);
    if (!passes(rule.primary_comparator, primary, rule.primary_threshold)) continue;
    const value = (rule.base_value || 0) +
      Math.floor(primary / Math.max(1, rule.divisor || 1)) * (rule.primary_factor || 0);
    if (value === 0) continue;
    amount += value;
    if (String(rule.primary_scope || '').startsWith('adjacent') && primary > 0){
      linked = true;
      sources = sources.concat(orthogonal(index).filter(n => {
        const p = S.board[n]; if (!p) return false;
        if (rule.primary_scope === 'adjacent_cats') return isCat(defs[p.key]);
        if (rule.primary_scope === 'adjacent_key') return containsToken(rule.primary_filter, p.key);
        if (rule.primary_scope === 'adjacent_kind')
          return defs[p.key].kind === String(rule.primary_filter || '').toLowerCase();
        return false;
      }));
    }
  }
  return { amount, linked, sources: [...new Set(sources)] };
}
function calculateEvents(){
  const events = [];
  for (let i = 0; i < S.board.length; i++){
    if (!S.board[i]) continue;
    const r = evaluatePiece(S.board[i], i);
    if (r.amount !== 0) events.push({ index:i, piece:S.board[i], ...r });
  }
  return events;
}

const NOTE = {

function registerNoteTarget(key, node){ if (key && node) NOTE.targets[key] = node; }

/**
 * 报告一个事件。返回 Promise，字条读完（或压根不弹）才 resolve——
 * 对应 Unity 的 Interject，调用方可以停在这一拍。
 */
function notify(triggerKey, overrideTargets){
  const row = tutorialByTrigger[triggerKey];
  if (!row || !META.tutorialEnabled) return Promise.resolve();
  if (row.once && META.tutorialsRead[row.id]) return Promise.resolve();
  if (NOTE.current && NOTE.current.row === row) return Promise.resolve();
  if (NOTE.queue.some(n => n.row === row)) return Promise.resolve();

  const given = (overrideTargets || []).filter(Boolean);
  let resolved = given.length ? given : null;
  if (!resolved && row.spotlight_target && NOTE.targets[row.spotlight_target])
    resolved = [NOTE.targets[row.spotlight_target]];

  return new Promise(done => {
    NOTE.queue.push({ row, targets: resolved, done });
    pumpNote();
  });
}

function pumpNote(){
  if (NOTE.current || !NOTE.queue.length) return;
  if (performance.now() < NOTE.nextAllowedShow){
    setTimeout(pumpNote, NOTE.nextAllowedShow - performance.now());
    return;
  }
  const note = NOTE.queue.shift();
  NOTE.current = note;

  const systemVoice = String(U.strOr('tutorial_system_voice_ids', ''))
    .split(/[,|]/).map(s => s.trim()).includes(note.row.id);
  text(NOTE.title, systemVoice ? U.strOr('tutorial_system_note_title', '系统提示')
                               : U.strOr('tutorial_note_title', '房东奶奶的字条'));
  text(NOTE.body, note.row.copy);
  autoShrink(NOTE.body, 25);
  layoutSpotlight(note.targets);

  playSfx('guidance');
  const root = $('#noteRoot');
  root.style.display = 'block';
  root.style.opacity = '0';
  root.animate([{opacity:0},{opacity:1}], {duration: NOTE.fadeSeconds * 1000, fill:'forwards'});
  NOTE.dismissableAt = performance.now() + NOTE.inputLock * 1000;
  // 出场后布局可能还在落位（图鉴刚展开等），下一帧再量一次聚光框
  requestAnimationFrame(() => { if (NOTE.current === note) layoutSpotlight(note.targets); });
}

/** 聚光：目标框外的四块压暗 + 四条边线。目标缺失就退化成全屏压暗，不画错位的框。 */
function layoutSpotlight(targets){
  const pad = U.numOr('tutorial_spotlight_padding', 8);
  const thick = U.numOr('tutorial_spotlight_edge_thickness', 4);
  let box = null;
  for (const t of targets || []){
    const node = typeof t === 'string' ? NOTE.targets[t] : t;
    if (!node || !node.isConnected || !node.offsetParent && node.offsetWidth === 0) continue;
    const r = designRect(node);
    if (r.w <= 0 || r.h <= 0) continue;
    box = box ? { x:Math.min(box.x, r.x), y:Math.min(box.y, r.y),
                  x2:Math.max(box.x2, r.x + r.w), y2:Math.max(box.y2, r.y + r.h) }
              : { x:r.x, y:r.y, x2:r.x + r.w, y2:r.y + r.h };
  }
  if (!box){
    place(NOTE.dims[0], 0, 0, 1536, 864);
    for (let i = 1; i < 4; i++) place(NOTE.dims[i], 0, 0, 0, 0);
    for (const e of NOTE.edges) place(e, 0, 0, 0, 0);
    return;
  }
  const x = box.x - pad, y = box.y - pad;
  const w = box.x2 - box.x + pad * 2, h = box.y2 - box.y + pad * 2;
  place(NOTE.dims[0], 0, 0, 1536, y);              // 上
  place(NOTE.dims[1], 0, y + h, 1536, 864 - y - h);// 下
  place(NOTE.dims[2], 0, y, x, h);                 // 左
  place(NOTE.dims[3], x + w, y, 1536 - x - w, h);  // 右
  place(NOTE.edges[0], x, y, w, thick);
  place(NOTE.edges[1], x, y + h - thick, w, thick);
  place(NOTE.edges[2], x, y, thick, h);
  place(NOTE.edges[3], x + w - thick, y, thick, h);
}

function dismissNote(){
  if (!NOTE.current || performance.now() < NOTE.dismissableAt) return;
  const note = NOTE.current;
  NOTE.current = null;
  if (note.row.once){ META.tutorialsRead[note.row.id] = true; saveMeta(); }
  NOTE.nextAllowedShow = performance.now() + NOTE.gapSeconds * 1000;
  const root = $('#noteRoot');
  root.animate([{opacity:1},{opacity:0}], {duration: NOTE.fadeSeconds * 1000, fill:'forwards'})
    .onfinish = () => { root.style.display = 'none'; };
  note.done();
  setTimeout(pumpNote, NOTE.gapSeconds * 1000);
}
function releaseAllNotes(){
  const pending = NOTE.queue.splice(0);
  for (const n of pending) n.done();
  if (NOTE.current){ const c = NOTE.current; NOTE.current = null; c.done(); }
  $('#noteRoot').style.display = 'none';
}

/* ==========================================================================
   7.5 背景音乐（移植 CatCafeMusicPlayer）
       播放列表按场景从 bgm_tracks_<场景名> 读，shuffle、循环、交叉淡入都走配置。
       浏览器不允许无交互自动播放，所以等玩家第一次点击再解锁。
   ========================================================================== */
const SCENE_OF = { start:'CatCafeStart', home:'CatCafeHome', game:'CatCafeDemo' };
const MUSIC = { players:[], active:0, playlist:[], cursor:0, scene:'', unlocked:false, fade:0 };

function buildMusic(){
  for (let i = 0; i < 2; i++){
    const a = new Audio();
    a.preload = 'none';
    a.volume = 0;
    a.addEventListener('ended', () => { if (MUSIC.players[MUSIC.active] === a) nextTrack(); });
    MUSIC.players.push(a);
  }
  // 首次交互解锁音频，之后按当前场景起播
  const unlock = () => {
    // 音效的 AudioContext 也要靠这次交互解锁
    if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
    if (MUSIC.unlocked) return;
    MUSIC.unlocked = true;
    applySceneMusic(currentScreen, true);
  };
  window.addEventListener('pointerdown', unlock, { once:true });
  window.addEventListener('keydown', unlock, { once:true });
}

const musicVolume = () =>
  U.numOr('bgm_base_volume', 0.45) * (META.musicVolume != null ? META.musicVolume : 1);

function readPlaylist(scene){
  const raw = U.strOr('bgm_tracks_' + scene, '');
  const list = raw.split(',').map(s => s.trim()).filter(Boolean);
  return String(U.strOr('bgm_shuffle', 'true')).toLowerCase() === 'true' ? shuffle(list) : list;
}

function applySceneMusic(screen, force){
  const scene = SCENE_OF[screen];
  if (!scene || (!force && scene === MUSIC.scene)) return;
  if (String(U.strOr('bgm_enabled', 'true')).toLowerCase() !== 'true') return;
  MUSIC.scene = scene;
  MUSIC.playlist = readPlaylist(scene);
  MUSIC.cursor = 0;
  if (MUSIC.unlocked) crossfadeTo(MUSIC.playlist[0]);
}

function nextTrack(){
  if (!MUSIC.playlist.length) return;
  MUSIC.cursor = (MUSIC.cursor + 1) % MUSIC.playlist.length;
  crossfadeTo(MUSIC.playlist[MUSIC.cursor]);
}

function crossfadeTo(track){
  if (!track) return;
  const seconds = U.numOr('bgm_crossfade_seconds', 2);
  const outgoing = MUSIC.players[MUSIC.active];
  const incoming = MUSIC.players[MUSIC.active = 1 - MUSIC.active];
  incoming.src = ART + U.strOr('bgm_resource_folder', 'CatCafe/Bgm').replace(/^CatCafe\//, '') +
    '/' + track + '.mp3';
  incoming.volume = 0;
  incoming.play().catch(() => { /* 还没解锁就静默失败，等下次交互 */ });

  clearInterval(MUSIC.fade);
  const target = musicVolume();
  const startedAt = performance.now();
  const fromOut = outgoing.volume;
  MUSIC.fade = setInterval(() => {
    const t = clamp((performance.now() - startedAt) / (seconds * 1000), 0, 1);
    incoming.volume = target * t;
    outgoing.volume = fromOut * (1 - t);
    if (t >= 1){
      clearInterval(MUSIC.fade);
      outgoing.pause();
    }
  }, 40);
}

function setMusicVolume(value){
  META.musicVolume = clamp(value, 0, 1);
  saveMeta();
  MUSIC.players[MUSIC.active].volume = musicVolume();
}

/* ==========================================================================
   7.6 按钮音效（移植 CatCafeAudioFeedback）
       Unity 那边不用音频素材，是每个场景现场合成一小段扫频正弦。这里用 Web Audio
       按同一条公式逐样本算出来，参数（起止频率/时长/振幅/播放音量）一个不改。
   ========================================================================== */
const SFX_SAMPLE_RATE = 44100;
const SFX_BASE_VOLUME = 0.62;
// [起始频率, 结束频率, 时长秒, 振幅, 播放音量] —— 与 CatCafeAudioFeedback.Initialize 一致
const SFX_TONES = {
  hover:     [520, 650, 0.045, 0.20, 0.24],
  click:     [180, 120, 0.075, 0.34, 0.34],
  rollStart: [180, 420, 0.220, 0.30, 0.34],
  rollStop:  [420, 235, 0.130, 0.32, 0.36],
  reward:    [620, 980, 0.160, 0.38, 0.42],
  guidance:  [360, 540, 0.110, 0.24, 0.28],
};
const SFX = { ctx:null, buffers:{}, lastHover:null };

/** 逐样本复刻 CreateTone：基频 + 0.18 倍二次谐波，两端各自钳位成淡入淡出包络 */
function buildTone(ctx, startFrequency, endFrequency, duration, amplitude){
  const count = Math.max(1, Math.ceil(duration * SFX_SAMPLE_RATE));
  const buffer = ctx.createBuffer(1, count, SFX_SAMPLE_RATE);
  const samples = buffer.getChannelData(0);
  let phase = 0;
  for (let i = 0; i < count; i++){
    const normalized = count > 1 ? i / (count - 1) : 0;
    phase += (startFrequency + (endFrequency - startFrequency) * normalized) / SFX_SAMPLE_RATE;
    const envelope = clamp(normalized * 22, 0, 1) * clamp((1 - normalized) * 12, 0, 1);
    samples[i] = (Math.sin(phase * Math.PI * 2) + Math.sin(phase * Math.PI * 4) * 0.18) *
      envelope * amplitude;
  }
  return buffer;
}

function buildSfx(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  SFX.ctx = new Ctx();
  for (const key in SFX_TONES){
    const [a, b, d, amp] = SFX_TONES[key];
    SFX.buffers[key] = buildTone(SFX.ctx, a, b, d, amp);
  }
  // 悬停/点击统一走事件委托，新建出来的按钮不用各自挂监听
  const TARGETS = '.hotspot,.paperbtn,.card,.token,.sticker,.rosterEntry,.pagebtn,.dexCard,.inviteRow';
  document.addEventListener('pointerover', e => {
    const hit = e.target.closest && e.target.closest(TARGETS);
    if (!hit || hit === SFX.lastHover) return;
    SFX.lastHover = hit;
    if (!hit.classList.contains('disabled') && !hit.disabled) playSfx('hover');
  });
  document.addEventListener('pointerout', e => {
    if (SFX.lastHover && !SFX.lastHover.contains(e.relatedTarget)) SFX.lastHover = null;
  });
  document.addEventListener('pointerdown', e => {
    const hit = e.target.closest && e.target.closest(TARGETS);
    if (hit && !hit.classList.contains('disabled') && !hit.disabled) playSfx('click');
  });
}

const sfxVolume = () => META.sfxVolume != null ? META.sfxVolume : 1;

function playSfx(key){
  const buffer = SFX.buffers[key];
  if (!SFX.ctx || !buffer) return;
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
  const source = SFX.ctx.createBufferSource();
  source.buffer = buffer;
  const gain = SFX.ctx.createGain();
  gain.gain.value = SFX_BASE_VOLUME * sfxVolume() * SFX_TONES[key][4];
  source.connect(gain).connect(SFX.ctx.destination);
  source.start();
}

function setSfxVolume(value){
  META.sfxVolume = clamp(value, 0, 1);
  saveMeta();
}

/* ==========================================================================
   7.65 规则文案里的内联棋子图标（移植 FormatRuleWithSymbolLinks + 棋子图标图集）
        Unity 把规则里出现的棋子/道具名替换成「图标 + 带下划线的名字」，整段包成
        可点的 link，点开是一张小说明卡。图标负责一眼认出，名字负责消歧——六种会员
        徽章缩到内联尺寸后几乎一样，光有图标读者分不出是哪一种。

        Unity 那边为了喂给 TMP 先烘了一张 64px 的图集；网页直接用源图裁到 alpha
        包围盒即可，效果等价而且更清晰。图集的裁剪规则（贴合可见轮廓、等比、居中）
        在这里用 bbox 复现。
   ========================================================================== */
const SYMBOL_ICON_SCALE = 1.6;   // 图集里的 sprite.scale，图标边长 = 字号 × 它
let symbolCandidates = [];

/** 名字 → 棋子/道具。同名指向不同对象的一律丢掉，免得点开是另一个东西。 */
function rebuildSymbolCandidates(){
  const byName = new Map(), ambiguous = new Set();
  const register = (name, kind, key) => {
    if (!name || !name.trim()) return;
    const id = kind + '|' + key;
    if (byName.has(name)){
      if (byName.get(name).id !== id) ambiguous.add(name);
      return;
    }
    byName.set(name, { name, id, kind, key });
  };
  for (const e of D.elements) register(e.name, 'element', e.key);
  for (const i of D.items) register(i.name, 'item', i.key);

  symbolCandidates = [...byName.values()].filter(c => !ambiguous.has(c.name));
  // 长名优先，否则「猫」会把「猫砂盆」截断
  symbolCandidates.sort((a, b) =>
    b.name.length - a.name.length || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

/**
 * 把源图裁到可见轮廓、等比缩放居中塞进一个正方形，对应图集生成里的 Downscale。
 * 尺寸一律用 em：TMP 的 sprite 是跟着字号走的，而这里的字号会被 autoShrink 反复调，
 * 用 px 写死会导致缩完字之后图标相对变大，把文字挤出框。
 */
function inlineIcon(asset){
  const em = SYMBOL_ICON_SCALE;
  const box = el('span', 'ico');
  box.style.cssText = `width:${em}em;height:${em}em`;
  const b = D.bbox[asset];
  const img = el('img', null, box);
  img.src = ART + encodeURI(asset) + '.png';
  if (b){
    const [bx, by, bw, bh, W, H] = b;
    const k = em / Math.max(bw, bh);          // 每源图像素对应多少 em
    img.style.cssText =
      `width:${(W * k).toFixed(4)}em;height:${(H * k).toFixed(4)}em;` +
      `left:${(em / 2 - (bx + bw / 2) * k).toFixed(4)}em;` +
      `top:${(em / 2 - (by + bh / 2) * k).toFixed(4)}em`;
  } else {
    img.style.cssText = `width:${em}em;height:${em}em;object-fit:contain;left:0;top:0`;
  }
  return box;
}

/**
 * 把一段规则文案渲染进节点：命中的名字换成「图标 + 下划线名字」，其余原样。
 * fontSize 用来定图标大小，和 TMP 里 sprite 跟随字号是一个意思。
 */
function renderRuleText(node, rule){
  node.textContent = '';
  // .txt 是 flex 容器，一旦塞进多个子节点它们就变成一行排开的 flex item 不再折行。
  // 富文本必须回到普通块级流里，靠 text-align 居中。
  node.style.display = 'block';
  node.style.textAlign = 'center';
  if (!rule){ return node; }
  let cursor = 0, plain = '';
  const flush = () => { if (plain){ node.appendChild(document.createTextNode(plain)); plain = ''; } };

  while (cursor < rule.length){
    const match = symbolCandidates.find(c => rule.startsWith(c.name, cursor));
    if (!match){ plain += rule[cursor++]; continue; }
    flush();
    const def = match.kind === 'item' ? itemDefs[match.key] : defs[match.key];
    const link = el('span', 'symLink', node);
    if (def && def.asset && D.bbox[def.asset]) link.appendChild(inlineIcon(def.asset));
    const label = el('span', 'symName', link);
    text(label, match.name);
    link.onclick = e => {
      // 整张卡也可点（选牌/看详情），链接得把事件吃掉，不然会连带触发
      e.stopPropagation();
      if (def) showSymbolReference(def, match.kind === 'item', e.clientX, e.clientY);
    };
    cursor += match.name.length;
  }
  flush();
  return node;
}

/**
 * 点开内联图标弹出的小说明卡。它是独立浮层，关掉自己不会连累底下的三选一/详情，
 * 尺寸和配色走 ui_symbol_reference_* 那一组配置。
 */
function showSymbolReference(def, isItem, clientX, clientY){
  document.querySelectorAll('.symbolRef').forEach(n => n.remove());
  const w = U.num('ui_symbol_reference_width'), h = U.num('ui_symbol_reference_height');
  const pad = U.num('ui_symbol_reference_panel_padding');
  const gap = U.num('ui_symbol_reference_content_spacing');
  const screenPad = U.num('ui_symbol_reference_screen_padding');
  const ink = U.color('ui_symbol_reference_text_color');

  const layer = el('div', 'symbolRef', $('#overlays'));
  layer.style.cssText = 'position:absolute;left:0;top:0;width:1536px;height:864px;' +
    'pointer-events:auto;z-index:5';
  layer.onclick = () => layer.remove();

  const card = el('div', null, layer);
  // 贴着点击位置弹，再夹回画布内，对应 PositionSymbolReference
  const stageBox = $('#stage').getBoundingClientRect();
  const scale = stageBox.width / 1536;
  const px = clamp((clientX - stageBox.left) / scale + U.num('ui_symbol_reference_horizontal_gap'),
    screenPad, 1536 - w - screenPad);
  const py = clamp((clientY - stageBox.top) / scale - h / 2, screenPad, 864 - h - screenPad);
  card.style.cssText = `position:absolute;left:${px}px;top:${py}px;width:${w}px;height:${h}px;` +
    `background:${U.color('ui_symbol_reference_panel_color')};border-radius:12px;` +
    `border:3px solid rgba(122,64,36,.55);box-shadow:4px -4px 0 rgba(48,28,16,.30);` +
    `padding:${pad}px;display:flex;flex-direction:column;align-items:center;gap:${gap}px`;
  card.onclick = e => e.stopPropagation();

  const iconSize = U.num('ui_symbol_reference_icon_size');

  slot.style.cssText = `position:relative;width:100%;height:${iconSize}px;flex:none;` +
    'display:flex;align-items:center;justify-content:center';
  if (def.asset){
    const img = el('img', null, slot);
    img.style.cssText = 'position:absolute;left:50%;top:50%;transform-origin:50% 50%';
    pawnVisual(img, def.asset, iconSize, iconSize, iconSize * U.num('ui_pawn_visual_fill_ratio'));
  }

  const title = el('div', 'txt', card);
  title.style.cssText = `width:100%;flex:none;height:${U.num('ui_symbol_reference_title_height')}px;` +
    `font-size:${U.font(U.int('ui_symbol_reference_title_font_size'))};color:${ink}`;
  text(title, def.name);

  const rarity = (rarityDefs[def.rarity] || {}).label || def.rarity;
  const meta = el('div', 'txt', card);
  meta.style.cssText = `width:100%;flex:none;height:${U.num('ui_symbol_reference_meta_height')}px;` +
    `font-size:${U.font(U.int('ui_symbol_reference_meta_font_size'))};color:${ink}`;
  text(meta, fmt(U.str('ui_card_detail_meta_format'),
    isItem ? U.str('ui_item_detail_type_label') : def.type_label, rarity));

  const rule = el('div', 'txt', card);
  rule.style.cssText = `width:100%;flex:1;min-height:0;overflow:hidden;align-items:flex-start;` +
    `font-size:${U.font(U.int('ui_symbol_reference_rule_font_size'))};color:${ink};line-height:1.5`;
  // 说明卡里的规则不再递归插图标，否则会一层套一层弹不完
  text(rule, def.rule_text || U.str('ui_card_detail_no_effect'));
  autoShrink(rule, U.int('ui_symbol_reference_rule_font_size'));

  const hint = el('div', 'txt', card);
  hint.style.cssText = `width:100%;flex:none;height:${U.num('ui_symbol_reference_hint_height')}px;` +
    `font-size:${U.font(U.int('ui_symbol_reference_hint_font_size'))};` +
    `color:${U.color('ui_symbol_reference_hint_color')}`;
  text(hint, U.str('ui_symbol_reference_close_hint'));
}

/* ==========================================================================
   7.7 试玩排行榜
       静态站点存不了数据，成绩要经 Supabase 的 REST 接口落库。
       anon key 本来就是设计成可公开的，真正的门禁在 Supabase 那侧的 RLS 策略上
       （只允许 insert 和 select，不允许 update/delete），所以能安全写进这个文件。
       没配后端时自动退化成本机排行榜，界面照常能走通。
   ========================================================================== */
const LEADERBOARD = {
  // Supabase 项目根地址（不含 /rest/v1，下面会自己拼）
  url: 'https://cgjrukulsamqrtrzqerh.supabase.co',
  // publishable key（新版，替代旧的 anon JWT）。它就是设计给前端公开用的，
  // 真正的门禁在 Supabase 那侧的 RLS 策略：只放行 insert 和 select。
  anonKey: 'sb_publishable_8QVg2fL1aGkDVWMeanWL3A_8i_4kYHH',
  table: 'catcafe_scores',
  limit: 20,
};
const leaderboardReady = () => !!(LEADERBOARD.url && LEADERBOARD.anonKey);
const LOCAL_BOARD_KEY = 'catcafe-html-board-v1';

function restHeaders(extra){
  const headers = { 'apikey': LEADERBOARD.anonKey, 'Content-Type': 'application/json' };
  // 旧版 anon key 是 JWT，PostgREST 认 Authorization: Bearer；新版 sb_publishable_
  // 是不透明串，塞进 Bearer 可能被判 401，只走 apikey 头即可。
  if (LEADERBOARD.anonKey.startsWith('eyJ'))
    headers['Authorization'] = 'Bearer ' + LEADERBOARD.anonKey;
  return Object.assign(headers, extra || {});
}

async function submitScore(name, score){
  const row = { name, score, days: S.stageIndex + 1, endless: S.endless };
  if (!leaderboardReady()){
    // 没接后端就存本机，至少排行榜界面是通的
    try {
      const local = JSON.parse(localStorage.getItem(LOCAL_BOARD_KEY) || '[]');
      local.push(Object.assign({ created_at: new Date().toISOString() }, row));
      localStorage.setItem(LOCAL_BOARD_KEY, JSON.stringify(local));
    } catch (e){ /* 无痕模式就算了 */ }
    return { ok:true, local:true };
  }
  try {
    const res = await fetch(`${LEADERBOARD.url}/rest/v1/${LEADERBOARD.table}`, {
      method:'POST', headers: restHeaders({ 'Prefer':'return=minimal' }), body: JSON.stringify(row),
    });
    return { ok: res.ok, local:false, error: res.ok ? null : `${res.status} ${await res.text()}` };
  } catch (e){
    return { ok:false, local:false, error:String(e) };
  }
}

async function fetchLeaderboard(){
  if (!leaderboardReady()){
    let local = [];
    try { local = JSON.parse(localStorage.getItem(LOCAL_BOARD_KEY) || '[]'); } catch (e){}
    local.sort((a, b) => b.score - a.score);
    return { rows: local.slice(0, LEADERBOARD.limit), local:true };
  }
  try {
    const query = `select=name,score,days,created_at&order=score.desc&limit=${LEADERBOARD.limit}`;
    const res = await fetch(`${LEADERBOARD.url}/rest/v1/${LEADERBOARD.table}?${query}`,
      { headers: restHeaders() });
    if (!res.ok) return { rows:[], local:false, error:`${res.status}` };
    return { rows: await res.json(), local:false };
  } catch (e){
    return { rows:[], local:false, error:String(e) };
  }
}

    place(btn, (720 - 270) / 2, 690 - 42 - 64);

    // 出场 0.42s：卡片 0.86→1，贴纸带 0.12 的过冲弹一下，两层光环同时张开
    const OPEN = 420;
    const t0 = performance.now();
    (function frameLoop(now){
      const t = clamp((now - t0) / OPEN, 0, 1);
      const cardT = 1 - Math.pow(1 - t, 3);
      card.style.transform = `scale(${0.86 + (1 - 0.86) * cardT})`;
      const st = clamp((t - 0.25) / 0.75, 0, 1);
      const stickerScale = (1 - Math.pow(1 - st, 3)) + Math.sin(st * Math.PI) * 0.12;
      sticker.style.transform = `scale(${stickerScale})`;
      haloOuter.style.transform = `scale(${0.55 + (1.18 - 0.55) * t})`;
      haloInner.style.transform = `scale(${0.45 + (1 - 0.45) * t})`;
      if (t < 1) requestAnimationFrame(frameLoop);
      else {
        card.style.transform = 'scale(1)';
        sticker.style.transform = 'scale(1)';
        // 稳态呼吸：sin(t·2.8)，外圈 1.02~1.10、内圈反相 0.98~1.04
        haloOuter.style.animation = 'haloOuterBreath 2.244s ease-in-out infinite';
        haloInner.style.animation = 'haloInnerBreath 2.244s ease-in-out infinite';
      }
    })(t0);
    playSfx('reward');
  });
}

function closeOverlays(){ $('#overlays').innerHTML = ''; }
function closeSymbolRefs(){ document.querySelectorAll('.symbolRef').forEach(n => n.remove()); }

/** 三层纸叠 + 主纸板 + 缎带标题，尺寸取自 NewOverlay */
function newOverlay(title, panelW, panelH, dismissable, opts){
  opts = opts || {};
  const ribbonH = opts.ribbonHeight || 88;
  const bodyGap = opts.bodyGap != null ? opts.bodyGap : 14;
  const overlay = el('div', 'overlay', $('#overlays'));
  if (opts.backdrop) overlay.style.background = opts.backdrop;
  // holeRect：在压暗层上挖一个洞，让底下那块 UI 既看得见也点得到。
  // 做法和教程聚光一样——不是一整块半透明盖住，而是用四条矩形围出空洞。
  if (opts.holeRect){
    const h = opts.holeRect;
    overlay.style.background = 'transparent';
    overlay.style.pointerEvents = 'none';
    const tint = opts.backdrop || 'rgba(26,17,10,.78)';
    for (const r of [
      { x:0, y:0, w:1536, h:h.y },
      { x:0, y:h.y + h.h, w:1536, h:864 - h.y - h.h },
      { x:0, y:h.y, w:h.x, h:h.h },
      { x:h.x + h.w, y:h.y, w:1536 - h.x - h.w, h:h.h },
    ]){
      const dim = el('div', 'abs', overlay);
      place(dim, r.x, r.y, r.w, r.h);
      dim.style.background = tint;
      dim.style.pointerEvents = 'auto';
      if (dismissable) dim.onclick = () => (opts.stack ? overlay.remove() : closeOverlays());
    }
  }
  const modal = el('div', 'modal', overlay);
  modal.style.width = panelW + 'px';
  modal.style.height = panelH + 'px';
  modal.style.pointerEvents = 'auto';
  if (opts.shiftX){
    // overlay 是 flex 居中，这里在居中基础上再平移
    modal.style.position = 'relative';
    modal.style.left = opts.shiftX + 'px';
  }

  for (const L of [
    { dx:-18, dy:10, w:panelW + 18, h:panelH + 12, tint:'brightness(.72) saturate(.9)' },
    { dx: 14, dy:-5, w:panelW + 10, h:panelH + 6,  tint:'brightness(.9)' },
    { dx: 0,  dy:0,  w:panelW,      h:panelH,      tint:null },
  ]){
    const p = el('div', 'paper', modal);
    p.style.width = L.w + 'px';
    p.style.height = L.h + 'px';
    p.style.transform = `translate(calc(-50% + ${L.dx}px), calc(-50% + ${-L.dy}px))`;
    p.style.borderImageSource = `url('${ART}PaperSkin/modal-main-v2.png')`;
    if (L.tint) p.style.filter = L.tint;
  }

  const inner = el('div', 'inner', modal);
  inner.style.width = (panelW - 36) + 'px';
  inner.style.height = (panelH - 36) + 'px';
  inner.style.paddingTop = '18px';

  const ribbon = el('div', 'ribbon', inner);
  ribbon.style.width = Math.min(724, panelW - 36) + 'px';
  ribbon.style.height = ribbonH + 'px';
  ribbon.style.flex = 'none';
  ribbon.style.fontSize = U.font(27);
  el('div', 'skin ribbon9', ribbon).style.borderImageSource =
    `url('${ART}PaperSkin/title-ribbon-v2.png')`;
  const ribbonLabel = el('div', null, ribbon);
  ribbonLabel.style.position = 'relative';
  text(ribbonLabel, title);

  const body = el('div', null, inner);
  body.style.cssText = 'flex:1;min-height:0;width:100%;overflow:hidden;display:flex;' +
    'flex-direction:column;align-items:center;justify-content:center;gap:' + bodyGap + 'px';

  // stack 的弹窗只关自己，不清空整个弹窗层——否则在三选一上面开一张详情，
  // 关掉详情会连三选一一起清掉，那一轮就等于被跳过了。
  const dismiss = opts.stack ? () => overlay.remove() : closeOverlays;
  if (dismissable) overlay.onclick = e => { if (e.target === overlay) dismiss(); };
  return { overlay, modal, body, dismiss };
}

function paperButton(parent, label, w, h, role, onClick){
  const b = el('div', 'paperbtn' + (role === 'secondary' ? ' secondary' : ''), parent);
  b.style.width = w + 'px';
  b.style.height = h + 'px';
  b.style.flex = 'none';
  b.style.fontSize = U.font(20);
  const skin = el('div', 'skin button9', b);
  skin.style.borderImageSource =
    `url('${ART}PaperSkin/button-${role === 'secondary' ? 'secondary' : 'primary'}-v2.png')`;
  // Unity 的 Sliced Image 在 Rect 比九宫格还小时让切片重叠继续画，CSS 会直接不画。
  // 按半高/半宽夹一下，取最接近的观感。
  skin.style.borderWidth = `${Math.min(34, h / 2)}px ${Math.min(64, w / 2)}px`;
  const span = el('div', null, b);
  span.style.position = 'relative';
  text(span, label);
  b.setLabel = value => text(span, value);
  b.onclick = onClick;
  return b;
}

function bodyText(parent, value, size, color, width){
  const n = el('div', 'txt', parent);
  n.style.cssText = `width:${width}px;font-size:${U.font(size)};color:${color};` +
    `line-height:1.7;white-space:pre-wrap;flex:none`;
  text(n, value);
  return n;
}

/**
 * 可按压的美术按钮。imgRect 是这张图在 1536×864 画布上的位置和尺寸，win 是裁切窗口。
 * 局内/开始界面的按钮画在整屏层里（imgRect 就是整块画布），大厅的立牌则是各自定位的小图，
 * 两种都靠这里的偏移换算对齐。窗口存在的意义是：按下时只有这一块缩放，不会拖着整屏一起动。
 */
function artButton(parent, layerSrc, imgRect, win, hotspot, onClick, name){
  const box = el('div', 'artbtn', parent);
  placeRect(box, win);
  const img = el('img', null, box);
  img.src = layerSrc;
  place(img, imgRect.x - win.x, imgRect.y - win.y, imgRect.w, imgRect.h);

  const hs = el('div', 'hotspot', parent);
  placeRect(hs, hotspot);
  hs.title = name || '';
  hs.onmouseenter = () => box.classList.add('hover');
  hs.onmouseleave = () => box.classList.remove('hover', 'press');
  hs.onmousedown = () => box.classList.add('press');
  hs.onmouseup = () => box.classList.remove('press');
  hs.onclick = onClick;
  return { box, hotspot: hs };
}

/** sprite sheet 逐帧：cols×rows 张，按 fps 走 background-position */
function animateSpriteSheet(node, cols, rows, fps){
  const total = cols * rows;
  let frame = 0;
  const step = () => {
    const c = frame % cols, r = Math.floor(frame / cols) % rows;
    node.style.backgroundPosition =
      `${cols > 1 ? (c / (cols - 1)) * 100 : 0}% ${rows > 1 ? (r / (rows - 1)) * 100 : 0}%`;
    frame = (frame + 1) % total;
  };
  step();
  setInterval(step, 1000 / Math.max(0.1, fps));
}

function openInvite(){
  closeOverlays();
  const { body } = newOverlay(U.str('ui_home_invite_title'), 900, 760, true);
  const interval = U.numOr('meta_fur_natural_interval_minutes', 60);
  const amount = U.numOr('meta_fur_natural_amount_per_interval', 1);
  const cap = U.numOr('meta_fur_natural_cap_per_breed', 12);
  bodyText(body, fmt(U.multiline('ui_home_invite_howto'), interval, amount, cap), 14, '#5b432e', 780);

  const list = el('div', 'dexScroll', body);
  list.style.cssText = 'width:800px;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:4px';

  const open = D.invites.filter(v => !META.discovered[v.child]);
  if (!open.length){
    bodyText(list, U.multiline('ui_home_invite_done'), 16, '#4d3021', 760);
  }
  for (const invite of open){
    const child = defs[invite.child];
    const a = defs[invite.inviter_a], b = invite.inviter_b ? defs[invite.inviter_b] : null;
    const knowsA = a && META.discovered[a.key];
    const knowsB = !b || META.discovered[b.key];
    const furA = META.fur[invite.inviter_a] || 0;
    const furB = b ? (META.fur[invite.inviter_b] || 0) : 0;
    const enough = knowsA && knowsB &&
      furA >= invite.fur_a && furB >= (invite.fur_b || 0) && META.cans >= invite.cans;

    const row = el('div', 'inviteRow' + (enough ? '' : ' off'), list);
    const pic = el('div', 'pic', row);
    if (child && child.asset){
      const img = el('img', null, pic);
      pawnVisual(img, child.asset, 70, 70, 66);
      if (!knowsA) img.style.filter = 'brightness(.15) saturate(0)';
    }
    const info = el('div', 'info', row);
    const nameLine = el('div', null, info);
    nameLine.style.fontSize = U.font(17);
    text(nameLine, knowsA
      ? fmt(U.str('ui_home_invite_target_format'), child ? child.name : invite.child)
      : U.str('ui_home_invite_target_unknown'));

    const costLine = el('div', null, info);
    costLine.style.cssText = `font-size:${U.font(14)};color:#6b5137`;
    const parts = [fmt(U.str('ui_home_invite_fur_format'), a ? a.name : invite.inviter_a, furA, invite.fur_a)];
    if (b) parts.push(fmt(U.str('ui_home_invite_fur_format'), b.name, furB, invite.fur_b));
    parts.push(fmt(U.str('ui_home_invite_cans_format'), Math.round(META.cans), invite.cans));
    text(costLine, parts.join(' ' + U.str('ui_home_invite_formula_connector') + ' '));

    if (invite.notes){
      const noteLine = el('div', null, info);
      noteLine.style.cssText = `font-size:${U.font(13)};color:#7f6549`;
      text(noteLine, knowsA ? invite.notes : U.str('ui_home_invite_locked_hint'));
    }

    paperButton(row, U.str('ui_home_invite_button'), 170, 48,
      enough ? 'primary' : 'secondary', () => {
        if (!knowsA || !knowsB){ showToast(U.str('ui_home_invite_need_friends')); return; }
        if (furA < invite.fur_a || furB < (invite.fur_b || 0)){
          showToast(U.str('ui_home_invite_need_fur')); return;
        }
        if (META.cans < invite.cans){ showToast(U.str('ui_home_invite_need_cans')); return; }
        META.fur[invite.inviter_a] = furA - invite.fur_a;
        if (b) META.fur[invite.inviter_b] = furB - invite.fur_b;
        META.cans -= invite.cans;
        META.discovered[invite.child] = true;
        saveMeta();
        refreshHome();
        openInvite();
        showToast(fmt(U.str('ui_home_invite_success_format'), child ? child.name : invite.child));
      }).classList.toggle('off', !enough);
  }

  paperButton(body, U.str('ui_home_settings_close'), 240, 52, 'secondary', closeOverlays);
  notify('home_invite_first', [list]);
}

    const strip = el('div', 'strip', v);
    strip.style.width = BOARD.cell + 'px';

/* ==========================================================================
   13. 卷轴滚动（移植 Reel* 常量与缓动曲线）
   ========================================================================== */
const REEL = {
  baseTravelSlots:16, extraTravelSlots:3,
  startStagger:0.045, baseDuration:1.28, stopDelay:0.18,
  anticipationDistance:10, anticipationDuration:0.09,
  stopOvershoot:13, bounceDuration:0.24,
};
const smoothStep01 = v => { const t = clamp(v, 0, 1); return t * t * (3 - 2 * t); };
/** ReelTravelProgress：20% 加速 + 巡航 + 34% 减速，位移是速度曲线的积分 */
function reelProgress(normalizedTime){
  const acceleration = 0.20, deceleration = 0.34;
  const cruise = 1 - acceleration - deceleration;
  const area = acceleration * 0.5 + cruise + deceleration * 0.5;
  const time = clamp(normalizedTime, 0, 1);
  if (time < acceleration){
    const t = time / acceleration;
    return acceleration * (t * t * t - 0.5 * t * t * t * t) / area;
  }
  if (time < acceleration + cruise) return (acceleration * 0.5 + time - acceleration) / area;
  const t = (time - acceleration - cruise) / deceleration;
  return (acceleration * 0.5 + cruise + deceleration * (t - t * t * t + 0.5 * t * t * t * t)) / area;
}
/** ReelTravelVelocity：动态模糊浓度 = 这条速度曲线 × 0.26 */
function reelVelocity(normalizedTime){
  const acceleration = 0.20, deceleration = 0.34, cruiseEnd = 1 - deceleration;
  const time = clamp(normalizedTime, 0, 1);
  if (time < acceleration) return smoothStep01(time / acceleration);
  if (time < cruiseEnd) return 1;
  return 1 - smoothStep01((time - cruiseEnd) / deceleration);
}

function spinReels(nextBoard){
  return new Promise(resolve => {
    REF.reelWrap.style.display = 'block';
    playSfx('rollStart');
    for (const c of REF.cells){ const t = c.querySelector('.token'); if (t) t.style.visibility = 'hidden'; }

    const randomKey = () => S.pool.length ? S.pool[Math.floor(Math.random() * S.pool.length)].key : null;
    const columns = REF.reels.map((reel, col) => {
      const travel = REEL.baseTravelSlots + col * REEL.extraTravelSlots;
      for (let i = 0; i < reel.capacity; i++){
        const finalSlot = i - (reel.capacity - BOARD.rows);
        let key;
        if (finalSlot >= 0){
          const piece = nextBoard[finalSlot * BOARD.cols + col];
          key = piece ? piece.key : null;
        } else key = randomKey();
        const img = reel.syms[i].img;
        if (key && defs[key] && defs[key].asset){
          img.style.display = '';
          img.src = ART + encodeURI(defs[key].asset) + '.png';
        } else img.style.display = 'none';
      }
      const end = -(reel.capacity - BOARD.rows) * BOARD.pitchY;
      const start = end + travel * BOARD.pitchY;
      reel.strip.style.transform = `translateY(${start}px)`;
      return { reel, start, end, delay: col * REEL.startStagger,
               duration: REEL.baseDuration + col * REEL.stopDelay };
    });

    const t0 = performance.now();
    function frame(now){
      const time = (now - t0) / 1000;
      let done = true;
      for (const c of columns){
        const local = time - c.delay;
        if (local < 0){ done = false; continue; }
        let y;
        if (local < REEL.anticipationDuration){
          // 起步前先往回一点，重量感来自这里
          y = c.start + Math.sin(local / REEL.anticipationDuration * Math.PI) * REEL.anticipationDistance;
          done = false;
        } else if (local < c.duration){
          const t = (local - REEL.anticipationDuration) / (c.duration - REEL.anticipationDuration);
          y = c.start + (c.end - c.start) * reelProgress(t);
          c.reel.blur.style.opacity = String(reelVelocity(t) * 0.26);
          done = false;
        } else if (local < c.duration + REEL.bounceDuration){
          // 冲过头再弹回来
          const t = (local - c.duration) / REEL.bounceDuration;
          y = c.end - REEL.stopOvershoot * Math.sin(t * Math.PI) * (1 - t);
          c.reel.blur.style.opacity = '0';
          done = false;
        } else {
          y = c.end;
          c.reel.blur.style.opacity = '0';
        }
        c.reel.strip.style.transform = `translateY(${y}px)`;
      }
      if (done){
        playSfx('rollStop');
        REF.reelWrap.style.display = 'none';
        for (const c of REF.cells){ const t = c.querySelector('.token'); if (t) t.style.visibility = ''; }
        resolve();
      } else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

const SPEED = () => U.numOr('settlement_speed_multiplier', 1.5);
/**
 * 金币特效放大倍数。表里的 settlement_rare_chain_coin_base_size(54) 和
 * ui_reward_label_coin_size(28) 是按 Unity 那版调的，在浏览器里看偏小，
 * 这里整体乘一个系数试手感。定下来之后要写回配置表，别让代码长期盖着表。
 */
/** 散射金币放大倍数。表里 base_size 54，再乘配置的 0.7~1.5 随机档，太大会盖住整个棋盘。 */
let COIN_BURST_SCALE = 1.75;
/** 飘字上那枚金币和它的光晕的放大倍数，和散射金币分开调。 */
let COIN_LABEL_SCALE = 1.9;
/**
 * 三选一卡面字号放大倍数。表里的 ui_choice_card_*_font_size 是按 Unity 那版调的，
 * 卡片实际显示偏小。定下来之后要写回配置表，别让代码长期盖着表。
 */
let CHOICE_FONT_SCALE = 1.12;

/**
 * 卡面稀有度面板的提亮参数。Rarities 表里的颜色是给徽章和描边调的，偏灰，
 * 铺成整块面板就发闷。这里只在面板这一处按 HSL 提饱和度和亮度，
 * 表里的原色仍然是徽章、描边、品质色签的唯一来源，不动它。
 */
const PANEL_MIN_SATURATION = 0.46;   // 饱和度下限，低于它就抬到这个值
const PANEL_LIGHTNESS_GAIN = 1.14;   // 亮度倍数
const PANEL_MAX_LIGHTNESS  = 0.62;   // 亮度上限，别把深色档冲成白板

function hexToHsl(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  const l = (max + min) / 2;
  if (!d) return { h:0, s:0, l };
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return { h: h * 60, s, l };
}

/** 表里的稀有度色 → 面板用的提亮版本 */
function panelColor(hex){
  const hsl = hexToHsl(hex);
  if (!hsl) return hex;
  const s = Math.max(hsl.s, PANEL_MIN_SATURATION);
  const l = Math.min(hsl.l * PANEL_LIGHTNESS_GAIN, PANEL_MAX_LIGHTNESS);
  return `hsl(${hsl.h.toFixed(1)} ${(s * 100).toFixed(1)}% ${(l * 100).toFixed(1)}%)`;
}

/**
 * 连击飙字。这是 Unity 没有的加料：连锁数摸到 chain_connected_threshold 之后，
 * 每多一次联动就把数字往上顶一档，越连越大越红。
 */
function showCombo(count){
  const threshold = U.numOr('chain_connected_threshold', 3);
  if (count < threshold) return;
  const over = count - threshold;
  const old = $('#comboTag');
  if (old) old.remove();

  const box = el('div', 'abs', $('#fx'));
  box.id = 'comboTag';
  // 摆在棋盘上沿居中：右上角会压到帮助按钮和书页边缘。
  // 底下垫一块深色托：不然浅金字落在浅纸面上读不清，压着棋子也糊。
  place(box, BOARD.x + BOARD.w / 2 - 160, BOARD.y + 8, 320, 96);
  box.style.cssText += 'display:flex;align-items:center;justify-content:center;gap:10px;' +
    'pointer-events:none;border-radius:14px;' +
    'background:radial-gradient(ellipse at center,rgba(38,18,8,.82),rgba(38,18,8,.34) 62%,transparent 78%)';

  const num = el('div', null, box);
  const size = Math.min(96, 48 + over * 9);
  // 越连越烫：从暖黄推到橙红
  const hue = Math.max(6, 46 - over * 7);
  num.style.cssText = `font-weight:700;font-size:${size}px;line-height:1;` +
    `color:hsl(${hue} 96% 58%);text-shadow:3px 3px 0 rgba(60,22,8,.85), 0 0 24px hsl(${hue} 100% 60% / .8)`;
  text(num, String(count));
  const tag = el('div', null, box);
  tag.style.cssText = `font-weight:700;font-size:${Math.round(size * 0.34)}px;color:#FFE7A6;` +
    'text-shadow:2px 2px 0 rgba(60,22,8,.85)';
  text(tag, '连锁');

  box.animate(
    [ { transform:'scale(.4) rotate(-8deg)', opacity:0 },
      { transform:'scale(1.25) rotate(3deg)', opacity:1, offset:.35 },
      { transform:'scale(1) rotate(0deg)', opacity:1, offset:.55 },
      { transform:'scale(1) rotate(0deg)', opacity:1, offset:.8 },
      { transform:'scale(1.1) rotate(0deg)', opacity:0 } ],
    // 缓动不能带过冲：cubic-bezier 的 y>1 会把进度提前推过最后一帧，
    // 数字还没看清就 opacity 归零了。弹跳已经写在上面的 scale 关键帧里。
    { duration: 1100 / SPEED(), easing:'ease-out' }
  ).onfinish = () => box.remove();
}

/** 被别人的结算波及时抖一下，对应 CatCafeLinkedPieceShake */
function shakePiece(index){
  const token = REF.cells[index] && REF.cells[index].querySelector('.token');
  if (!token) return;
  token.classList.remove('shaking');
  void token.offsetWidth;
  token.classList.add('shaking');
}

function pulseCell(index, seconds, peak, markerAlpha){
  const cell = REF.cells[index];
  const token = cell.querySelector('.token');
  cell.classList.add('linked');
  cell.style.setProperty('--markerAlpha', markerAlpha);
  if (token){
    token.style.setProperty('--pulse', (seconds / SPEED()) + 's');
    token.style.setProperty('--peak', peak);
    token.classList.remove('pulse');
    void token.offsetWidth;
    token.classList.add('pulse');
  }
}

async function countMoneyTo(target){
  const from = S.money, steps = 12;
  if (target > from){ playSfx('reward'); S.totalRevenue += target - from; }
  for (let i = 1; i <= steps; i++){
    S.money = Math.round(from + (target - from) * (i / steps));
    text(REF.goalText, S.money + ' / ' + stage().target);
    await wait(24);
  }
  S.money = target;
  text(REF.goalText, S.money + ' / ' + stage().target);
}

async function playSettlement(events){
  S.lastIncome = {};
  for (const e of events) S.lastIncome[e.piece.uid] = e.amount;
  if (!events.length) return;

  showToast(U.str('ui_settlement_collect_start'));
  await sec(U.numOr('settlement_collect_intro_seconds', .24));

  // 联动棋子优先：最左列到最右列、每列从上到下逐个演出，每个演完立刻入账
  const linked = events.filter(e => e.linked).sort((a, b) => {
    const ca = a.index % BOARD.cols, cb = b.index % BOARD.cols;
    return ca !== cb ? ca - cb : a.index - b.index;
  });
  const threshold = U.numOr('chain_connected_threshold', 3);
  let firstSynergyShown = false;
  let comboCount = 0;

  for (const e of linked){
    const high = e.amount >= threshold * 3 || e.sources.length >= threshold;
    const seconds = high ? U.numOr('settlement_reaction_high_seconds', .40)
                         : U.numOr('settlement_reaction_linked_seconds', .32);
    const peak = high ? U.numOr('settlement_reaction_high_scale', 1.12)
                      : U.numOr('settlement_reaction_linked_scale', 1.08);
    const alpha = high ? U.numOr('settlement_reaction_high_marker_alpha', .30)
                       : U.numOr('settlement_reaction_linked_marker_alpha', .24);

    const lines = e.sources.map(src => drawChainLink(src, e.index));
    for (const src of e.sources){
      REF.cells[src].classList.add('linked');
      shakePiece(src);
    }
    pulseCell(e.index, seconds, peak, alpha);

    const names = e.sources.map(i => defs[S.board[i].key].name);
    const limit = U.numOr('settlement_source_name_limit', 3);
    const label = names.length === 0 ? U.str('ui_settlement_plain_group_label')
      : names.length === 1 ? fmt(U.str('ui_settlement_single_link_label_format'), names[0])
      : fmt(U.str('ui_settlement_multi_link_label_format'),
            names.slice(0, limit).join(U.str('ui_settlement_source_separator')), names.length);
    showToast(fmt(U.str('ui_settlement_reaction_format'), label, e.amount));
    showCombo(++comboCount);

    // 字条讲的就是"这一对挨在一起"，所以只在盘面真有这一对时停一拍
    if (!firstSynergyShown && e.sources.length){
      firstSynergyShown = true;
      await notify('run_first_synergy', [REF.cells[e.index], REF.cells[e.sources[0]]]);
    }

    await sec(seconds);
    rewardLabel(e.index, e.amount,
      high ? U.color('ui_settlement_high_color') : U.color('ui_settlement_linked_color'));
    if (high) coinBurst(e.index);
    await countMoneyTo(S.money + e.amount);
    lines.forEach(l => l.remove());
    for (const src of e.sources) REF.cells[src].classList.remove('linked');
    REF.cells[e.index].classList.remove('linked');
    await sec(U.numOr('settlement_reaction_group_gap_seconds', .06));
  }

  // 剩下的普通棋子按相同金额合成一批：同批一起亮、一起入账
  const batches = new Map();
  for (const e of events.filter(e => !e.linked)){
    if (!batches.has(e.amount)) batches.set(e.amount, []);
    batches.get(e.amount).push(e);
  }
  const ordered = [...batches.entries()].sort((a, b) => b[0] - a[0]);
  let collected = linked.reduce((s, e) => s + e.amount, 0);

  for (let i = 0; i < ordered.length; i++){
    const [amount, group] = ordered[i];
    const total = amount * group.length;
    collected += total;
    for (const e of group){
      pulseCell(e.index, U.numOr('settlement_reaction_plain_seconds', .18),
        U.numOr('settlement_payout_peak_scale', 1.05),
        U.numOr('settlement_payout_marker_alpha', .22));
      rewardLabel(e.index, amount, U.color('ui_settlement_payout_color'));
    }
    showToast(fmt(U.str('ui_settlement_batch_format'),
      U.str('ui_settlement_plain_group_label'), amount, group.length, total, collected));
    await sec(U.numOr('settlement_payout_batch_pulse_seconds', .14));
    await countMoneyTo(S.money + total);
    for (const e of group) REF.cells[e.index].classList.remove('linked');
    await sec(U.numOr('settlement_payout_batch_hold_seconds', .14));
    if (i < ordered.length - 1) await sec(U.numOr('settlement_payout_batch_gap_seconds', .08));
  }

  showToast(fmt(U.str('ui_settlement_total_format'), events.reduce((s, e) => s + e.amount, 0)), 3200);
  await sec(U.numOr('settlement_total_hold_seconds', .36));
}

/** 掉毛：每只上场的猫按 meta_fur_drop_chance 掉 1 撮自己品种的绒毛 */
async function settleFurDrops(){
  const chance = U.numOr('meta_fur_drop_chance', 0.2);
  const cap = U.numOr('meta_fur_natural_cap_per_breed', 12) * 4; // 营业掉落不受自然积攒上限约束
  let gained = 0, firstIndex = -1;
  for (let i = 0; i < S.board.length; i++){
    const piece = S.board[i];
    if (!piece || !isCat(defs[piece.key])) continue;
    if (Math.random() >= chance) continue;
    const before = META.fur[piece.key] || 0;
    if (before >= cap) continue;
    META.fur[piece.key] = before + 1;
    gained += 1;
    if (firstIndex < 0) firstIndex = i;
  }
  if (!gained) return;
  S.runFur += gained;
  saveMeta();
  furBurst(firstIndex);
  showToast(fmt(U.str('ui_note_fur_format'), gained));
  await notify('fur_first_drop', [REF.cells[firstIndex]]);
}

/* ==========================================================================
   15. 回合流程（对应 RunRound）
   ========================================================================== */
function buildNextBoard(){
  const picked = shuffle(S.pool).slice(0, Math.min(S.pool.length, BOARD.size));
  const out = picked.slice();
  while (out.length < BOARD.size) out.push(null);
  return shuffle(out);
}

async function rollRound(){
  if (S.busy) return;
  S.busy = true;
  setStartEnabled(false);

  const nextBoard = buildNextBoard();
  S.board = nextBoard;
  for (const p of nextBoard) if (p) p.lifetimeRounds += 1;
  refreshBoard();
  await spinReels(nextBoard);
  await wait(U.numOr('round_roll_stop_delay', .08) * 1000);

  await playSettlement(calculateEvents());
  await settleFurDrops();

  S.round += 1;
  S.stageRound += 1;
  updateHud();

  // 名册超过棋盘位置时，没上场的会在后面等候
  if (S.pool.length > BOARD.size) await notify('pool_first_overflow', [REF.roster]);

  if (S.stageRound >= stage().rounds){
    await wait(U.numOr('stage_finish_delay', .2) * 1000);
    endStage();
    return;
  }
  // 下一次就是今天最后一个波次
  if (S.stageRound === stage().rounds - 1) await notify('run_first_rent_countdown', [REF.goalText]);

  await wait(U.numOr('reward_choice_delay', .2) * 1000);
  showChoices();
}

function setStartEnabled(on){
  const hs = REF.startBtn.hotspot;
