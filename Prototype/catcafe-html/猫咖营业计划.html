function rollRarity(context){
  const w = D.weights.find(x => x.context === context) || D.weights[0];
  const table = [['common', w.common], ['uncommon', w.uncommon], ['rare', w.rare], ['special', w.special || 0]];
  const total = table.reduce((s, t) => s + t[1], 0);
  let roll = Math.random() * total;
  for (const [key, weight] of table){ roll -= weight; if (roll <= 0) return key; }
  return 'common';
}
function rewardOptions(){
  const count = U.numOr('base_reward_option_count', 3);
  const keys = [];
  let guard = 0;
  while (keys.length < count && guard++ < 200){
    const rarity = rollRarity(stage().rarity_context);
    const pool = D.elements.filter(e =>
      e.unlock === 'base' && (e.pool_rarity || e.rarity) === rarity && !keys.includes(e.key));
    if (pool.length) keys.push(pool[Math.floor(Math.random() * pool.length)].key);
  }
  while (keys.length < count){
    const fallback = D.elements.filter(e => e.unlock === 'base' && !keys.includes(e.key));
    if (!fallback.length) break;
    keys.push(fallback[Math.floor(Math.random() * fallback.length)].key);
  }
  return shuffle(keys);
}
function itemOptions(tier){
  const context = 'item_tier' + clamp(tier, 0, 5);
  const keys = [];
  let guard = 0;
  while (keys.length < 3 && guard++ < 200){
    const rarity = rollRarity(context);
    const pool = D.items.filter(i =>
      i.rarity === rarity && !keys.includes(i.key) && !S.items.includes(i.key));
    if (pool.length) keys.push(pool[Math.floor(Math.random() * pool.length)].key);
  }
  return keys;
}

function rosterHoleRect(){
  const v = U.rect('ui_piece_viewport');
  // 露出整个名册页，不只是那条棋子列表：上到卷轴标题、下到翻页栏，
  // 左右各留一截让书页的边缘也在洞里，看着才像"这一页是亮的"。
  const padX = 46, padTop = 74, padBottom = 62;
  return { x:v.x - padX, y:v.y - padTop,
           w:v.w + padX * 2, h:v.h + padTop + padBottom };
}
function choiceShiftX(panelW){
  const hole = rosterHoleRect();
  // 面板右边缘顶到洞的左侧，再留一点缝
  const wanted = (hole.x - 16) - panelW / 2 - 768;
  return Math.min(0, Math.round(wanted));
}

/**
 * 无尽挑战的目标曲线，移植 CalculateNextEndlessTarget：
 * 上一天目标 ×(1+growth) + flat，再向上取整到 round_to 的倍数，且至少比上一天多 1。
 */
function nextEndlessTarget(previousTarget){
  const growth = Math.max(0, U.numOr('endless_target_growth_rate', 0.15));
  const flat = Math.max(0, U.numOr('endless_target_flat_increment', 10));
  const roundTo = Math.max(1, U.numOr('endless_target_round_to', 5));
  const raw = previousTarget * (1 + growth) + flat;
  return Math.ceil(Math.max(previousTarget + 1, raw) / roundTo) * roundTo;
}
/** 追加一天无尽关卡，字段沿用上一天，只有名字/波次/目标/稀有度池不同 */
function appendEndlessStage(previous, day, target){
  D.stages.push({
    id: day,
    name: fmt(U.str('endless_stage_name_format'), day),
    rounds: Math.max(1, U.numOr('endless_rounds', 6)),
    target,
    rarity_context: U.str('endless_rarity_context'),
    clear_item_tier: previous.clear_item_tier,
    clear_reward_min_rarity: previous.clear_reward_min_rarity,
    is_final: false,
    enabled: true,
  });
}

/**
 * 失败印章，移植 PlayFailureStamp：整层暗红淡入的同时，字从 1.9 倍砸到正位，
 * 停 0.95s 再淡出。时长取表里的 run_fail_fx_*，表里没配就用 Unity 的默认值。
 */
function playFailureStamp(){
  const flash = U.numOr('run_fail_fx_flash_seconds', 0.16);
  const hold = U.numOr('run_fail_fx_hold_seconds', 0.95);
  const fade = U.numOr('run_fail_fx_fade_seconds', 0.35);

  const layer = el('div', 'abs', $('#fx'));
  place(layer, 0, 0, 1536, 864);
  layer.style.background = 'rgba(56,13,10,.62)';
  const stamp = makeText(layer, 64, '#F5DEB8');
  place(stamp, (1536 - 1100) / 2, (864 - 140) / 2, 1100, 140);
  stamp.style.textShadow = '4px 4px 0 rgba(26,8,6,.75)';
  text(stamp, U.strOr('run_fail_stamp_text', '没 达 到 营 业 额 ……'));

  playSfx('rollStop');
  layer.animate([{opacity:0},{opacity:1}],
    { duration: flash * 1000, easing:'cubic-bezier(.22,.61,.36,1)', fill:'forwards' });
  stamp.animate([{transform:'scale(1.9)'},{transform:'scale(1)'}],
    { duration: flash * 1000, easing:'cubic-bezier(.22,.61,.36,1)', fill:'forwards' });
  setTimeout(() => {
    layer.animate([{opacity:1},{opacity:0}], { duration: fade * 1000, fill:'forwards' })
      .onfinish = () => layer.remove();
  }, (flash + hold) * 1000);
  return (flash + hold + fade) * 1000;
}

async function endStage(){
  closeOverlays();
  const cleared = S.money >= stage().target;
  const current = stage();
  // 正常经营的最后一天；进了无尽之后就再也没有"最后一天"了
  const finishedNormalRun = cleared && !S.endless && S.stageIndex >= NORMAL_STAGE_COUNT - 1;

  if (cleared){
    META.cans += U.numOr('meta_cans_per_stage_clear', 10);
    saveMeta();
    // 通关一天就撒一次；正常经营全通或无尽越走越远时撒得更狠
    const grand = finishedNormalRun || S.endless;
    confettiBurst(grand ? 160 : 80, grand ? 3.4 : 2.4);
    playSfx('reward');
  }

  // 通关正常经营后询问是否续摊；这是无尽挑战的唯一入口，和 OfferEndlessChallenge 一致
  if (finishedNormalRun && String(U.strOr('endless_enabled', 'True')).toLowerCase() === 'true'){
    const nextDay = S.stageIndex + 2;
    const target = nextEndlessTarget(current.target);
    const { body } = newOverlay(U.str('ui_endless_offer_title'), 680, 530, false);
    bodyText(body, fmt(U.multiline('ui_endless_offer_copy_format'),
      S.stageIndex + 1, nextDay, target), 18, '#40291c', 604).style.flex = '1';
    paperButton(body, U.str('ui_endless_continue_label'), 360, 62, 'primary', () => {
      closeOverlays();
      S.endless = true;
      appendEndlessStage(current, nextDay, target);
      advanceToNextStage(current.clear_item_tier);
    });
    paperButton(body, U.str('ui_endless_finish_label'), 300, 52, 'secondary',
      () => { closeOverlays(); endRun(true); });
    return;
  }

  // 失败三拍：印章 → 字条 → 今日账本，顺序和 Unity 的 PlayFailureSequence 一致
  if (!cleared) await wait(playFailureStamp());

  let title, copy, button;
  if (!cleared){
    title = S.endless ? U.str('ui_endless_result_title') : U.str('ui_run_failure_title');
    copy = S.endless
      ? fmt(U.multiline('ui_endless_failure_copy_format'),
            S.stageIndex + 1, current.target, collectionLine())
      : fmt(U.str('ui_run_failure_copy_format'), current.target, collectionLine());
    button = U.str('ui_run_return_collection_label');
  } else {
    title = fmt(U.str(S.endless ? 'ui_endless_stage_clear_title_format'
                                : 'ui_run_stage_clear_title_format'), S.stageIndex + 1);
    copy = fmt(U.str('ui_run_stage_clear_copy_format'), current.target, S.money);
    button = U.str('ui_run_stage_clear_button');
  }

  const { body } = newOverlay(title, 680, 530, false);
  bodyText(body, copy + '\n' + fmt(SCORE_LINE_FORMAT, S.totalRevenue),
    18, '#40291c', 604).style.flex = '1';

  paperButton(body, button, 360, 62, 'primary', async () => {
    closeOverlays();
    if (!cleared){ await endRun(false); return; }
    // 无尽模式下一天在这里现算现加，和 Unity 的 stages.Add 时机一致
    if (S.endless && S.stageIndex + 1 >= D.stages.length)
      appendEndlessStage(current, S.stageIndex + 2, nextEndlessTarget(current.target));
    advanceToNextStage(current.clear_item_tier);
  });

  if (!cleared) await notify('run_first_failure');
  await notify('run_first_summary', [$('#overlays .modal')]);
}

function advanceToNextStage(tier){

  S.stageRound = 0;

  S.rerollTokens += U.numOr('stage_clear_reroll_reward', 1);

async function endRun(cleared){
  META.runs += 1;
  if (cleared) META.clears += 1;
  // 排行榜比的是单局累计营业额，取历史最高
  if (S.totalRevenue > (META.bestScore || 0)) META.bestScore = S.totalRevenue;
  // 没通关的那次，路上的罐头要打折
  const earned = Math.round(S.money * U.numOr('meta_cans_coin_rate', 0.2) /
    (cleared ? 1 : U.numOr('meta_cans_fail_divisor', 2)));
  META.cans += earned;
  saveMeta();
  releaseAllNotes();
  showScreen('home');
  refreshHome();
  const isFirstReturn = !META.tutorialsRead['main_10_home_return'];
  await notify('home_first_return');
  if (S.runFur > 0) await notify('home_fur_first', [REF.homeInviteStand]);
  if (META.cans > 0) await notify('home_cans_first', [REF.homeCansBar]);
  if (S.runDiscoveries.length) await notify('home_first_new_cat', [REF.homeDexStand]);
  if (isFirstReturn) refreshHome();
}

function canDismissPiece(){
  return S.removalTokens > 0 && !S.busy && S.pool.length > 1;
}

/**
 * 按实例送走一枚棋子（消耗一张下班券）。对应 DismissCardDetailPiece。
 * 「被移除时获得 N 金币」这类 on_dismiss 规则在这里兑现——送走它才是它真正的收益时刻。
 */
async function dismissPiece(piece){
  if (!canDismissPiece()) return;
  const poolIndex = S.pool.findIndex(p => p.uid === piece.uid);
  if (poolIndex < 0) return;

  S.removalTokens -= 1;
  S.pool.splice(poolIndex, 1);
  const boardIndex = S.board.findIndex(p => p && p.uid === piece.uid);
  if (boardIndex >= 0) S.board[boardIndex] = null;

  const def = defs[piece.key];
  refreshBoard();
  refreshRoster();
  updateHud();
  showToast(fmt(U.strOr('ui_card_detail_dismiss_toast_format', '{0}下班回家啦'), def.name));

  const payout = evaluatePiece(piece, boardIndex >= 0 ? boardIndex : 0, 'on_dismiss').amount;
  if (payout > 0){
    if (boardIndex >= 0) rewardLabel(boardIndex, payout, U.color('ui_settlement_payout_color'));
    await countMoneyTo(S.money + payout);
  }
}

function showCardDetail(piece, index){
  const def = defs[piece.key];
  if (!def) return;
  const rarity = (rarityDefs[def.rarity] || {}).label || def.rarity;
  const meta = fmt(U.str('ui_card_detail_meta_format'), def.type_label, rarity);
  let income;
  if (index < 0) income = U.str('ui_card_detail_not_on_board');
  else if (S.lastIncome[piece.uid] != null)
    income = fmt(U.str('ui_card_detail_income_format'), S.lastIncome[piece.uid]);
  else
    income = fmt(U.str('ui_card_detail_preview_income_format'), evaluatePiece(piece, index).amount);
  // 名册和棋盘上的实例都能送走；uid < 0 是图鉴那种只读预览
  const canSend = piece.uid > 0 && S.pool.some(p => p.uid === piece.uid);
  detailOverlay(def.name, def, meta, income, canSend ? () => dismissPiece(piece) : null);
}

function showItemDetail(item){
  const rarity = (rarityDefs[item.rarity] || {}).label || item.rarity;
  detailOverlay(item.name, item,
    fmt(U.str('ui_card_detail_meta_format'), U.str('ui_item_detail_type_label'), rarity), null);
}

/* ==========================================================================
   19. 开局 / 屏幕切换
   ========================================================================== */
let currentScreen = 'start';
function showScreen(name){
  currentScreen = name;
  applySceneMusic(name);
  for (const id of ['start','home','game'])
    $('#screen' + id[0].toUpperCase() + id.slice(1)).classList.toggle('on', id === name);
}

async function startRun(){
  S.money = 0; S.round = 0; S.stageIndex = 0; S.stageRound = 0;
  S.pool = []; S.items = []; S.buffPage = 0; S.rosterPage = 0;
  S.lastIncome = {}; S.runFur = 0; S.runDiscoveries = [];
  S.endless = false; S.totalRevenue = 0;
  D.stages.length = NORMAL_STAGE_COUNT;   // 丢掉上一局追加的无尽关卡
  S.rerollTokens = U.numOr('initial_reroll_tokens', 1);
  S.removalTokens = U.numOr('initial_removal_tokens', 1);
  for (const row of D.initialDeck)
    for (let i = 0; i < row.count; i++) S.pool.push(newPiece(row.element_key));

  // 开局静态预览：拉杆前先把名册里的棋子摆上桌，和 Unity 首屏一致
  S.board = buildNextBoard();
  showScreen('game');
  refreshBoard();
  refreshRoster();
  refreshBuffPanel();
  updateHud();
  S.busy = false;
  setStartEnabled(true);

  const secondRun = META.runs >= 1;
  // 第一次营业：先教"点开看收益"，再教"拉杆"
  if (!secondRun){
    const firstCell = REF.cells.find(c => c.querySelector('.token'));
    await notify('run_first_inspect', firstCell ? [firstCell] : null);
  }
  await notify('run_first_enter', [REF.startBtn.hotspot]);
  if (secondRun) await notify('run_second_before_roll', [REF.startBtn.hotspot]);
}

function fitStage(){
  const s = Math.min(window.innerWidth / 1536, window.innerHeight / 864);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}

async function boot(){
  // CONFIG_URL 为空表示这是分发副本，身边没有导出表，直接用内嵌快照
  if (CONFIG_URL) try {
    const res = await fetch(CONFIG_URL, { cache:'no-store' });
    if (res.ok){ D = adoptLiveConfig(await res.json()); dataSource = '实时读取导出表'; }
  } catch (e){
    // file:// 下浏览器不允许 fetch 本地 JSON，用内嵌快照就好
  }
  indexData();
  initBoardMetrics();
  loadMeta();
  buildNote();
  buildMusic();
  buildSfx();
  buildStartScreen();
  buildHomeScreen();
  buildGameScreen();
  refreshStartScreen();
  showScreen('start');
  if (DEV_NOTES) text($('#srcBadge'), '数据：' + dataSource + ' · 美术：' + ART);
  fitStage();
  window.addEventListener('resize', fitStage);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  $('#loading').remove();
}

/*
  NOT_IMPLEMENTED —— 明确没有移植的部分，别把这份当成完整对局：
  · 道具（items）的收益改写、繁育、消耗类事件、on_dismiss 规则一律不生效，
    所以金额比正式版偏低；道具只登记和展示。
  · 未移植的规则作用域一律返回 0，不硬编造数值。
  · 背景音乐按 bgm_tracks_<场景> 播；按钮音效按 CatCafeAudioFeedback 的合成参数用 Web Audio 复现。
  · PV、多存档槽、无尽模式、下班券、亲密度里程碑没有做。
  · 大厅的绒毛/罐头按配置表的公式走，但存在浏览器 localStorage 里，和 Unity 存档不通。
*/
boot();
</script>
